name: Deploy site to GitHub Pages

# Publishes the Evidence site to GitHub Pages from the real, R2-pinned data.
# The warehouse is materialised from every source's pinned snapshot (SHA256
# verified), so the published numbers carry the same provenance guarantee as the
# reproducibility job. Requires the R2_* secrets and every source pinned in R2;
# materialize_warehouse.py fails loudly otherwise, so the site is never
# published from incomplete or unverified data.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow the deploy job to publish to Pages via OIDC.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; don't cancel an in-progress publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked --all-groups
      - name: Materialise warehouse from R2 (SHA256-verified)
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: uv run python scripts/materialize_warehouse.py
      - name: Export ESRS E1 disclosure bundle
        # Generate the auditable CSRD/ESRS E1 bundle from the same R2-pinned
        # warehouse and place it in the site's static dir, so the published
        # disclosure page offers a download that traces to the pinned release.
        run: uv run python scripts/export_esrs_e1.py --out-dir site/static/downloads/esrs_e1
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install site dependencies
        working-directory: site
        run: npm ci
      - name: Generate sources from the warehouse
        working-directory: site
        run: npm run sources
      - name: Build site
        working-directory: site
        run: npm run build
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
