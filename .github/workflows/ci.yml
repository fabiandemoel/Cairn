name: CI

on:
  # paths-ignore skips the build/lint/test matrix when a PR/push touches ONLY
  # these pure-docs files (no build depends on them) â€” chiefly the weekly
  # replenish PR, which edits BACKLOG.md alone. A mixed PR (docs + code) still
  # runs CI. NB: site/**/*.md are Evidence pages and are deliberately NOT
  # listed â€” changing one must still trigger evidence-build. CAVEAT: if these
  # jobs are required status checks under branch protection, a fully-skipped
  # run reports no check and the PR can stay "expected" â€” verify before relying
  # on it for the replenish PR.
  pull_request:
    paths-ignore:
      - "BACKLOG.md"
      - "README.md"
      - "CLAUDE.md"
  push:
    branches: [main]
    paths-ignore:
      - "BACKLOG.md"
      - "README.md"
      - "CLAUDE.md"
  workflow_dispatch:
  schedule:
    # Weekly reproducibility check against the real manifest + R2 (Mon 05:00 UTC)
    - cron: "0 5 * * 1"

env:
  DBT_PROFILES_DIR: transform

jobs:
  lint:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked --all-groups
      - name: ruff check
        run: uv run ruff check .
      - name: ruff format check
        run: uv run ruff format --check .
      - name: sqlfluff lint
        run: uv run sqlfluff lint transform/models transform/tests

  test:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked --all-groups
      - name: pytest
        run: uv run pytest -q

  dbt-build:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked --all-groups
      - name: dbt build (fixture)
        run: uv run dbt build --project-dir transform

  evidence-build:
    # Smoke-test the Evidence site: build the dbt warehouse from fixtures, then
    # build the site strictly (fails on any query error). Static output only.
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked --all-groups
      - name: dbt build (fixture) -> cairn.duckdb
        run: uv run dbt build --project-dir transform
      - name: Export ESRS E1 disclosure bundle (smoke test + site download)
        # Runs the export end-to-end against the fixture warehouse, and writes
        # the bundle into the site's static dir so the disclosure page's
        # download links resolve in the strict build.
        run: uv run python scripts/export_esrs_e1.py --out-dir site/static/downloads/esrs_e1
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install site dependencies
        working-directory: site
        run: npm ci
      - name: Build site (strict)
        working-directory: site
        run: npm run build:strict

  benchmark-diff:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout PR
        uses: actions/checkout@v4
        with:
          path: pr
      - name: Checkout main (baseline)
        uses: actions/checkout@v4
        with:
          ref: main
          path: base
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Build PR mart
        working-directory: pr
        run: |
          uv sync --locked --all-groups
          CAIRN_DUCKDB="$RUNNER_TEMP/pr.duckdb" uv run dbt build --project-dir transform
          uv run python scripts/export_mart.py "$RUNNER_TEMP/pr.duckdb" "$RUNNER_TEMP/new.parquet"

      - name: Build baseline mart from the same fixture
        id: baseline
        run: |
          if [ ! -f base/transform/dbt_project.yml ]; then
            echo "no_baseline=true" >> "$GITHUB_OUTPUT"
            echo "Baseline (main) has no dbt project yet; skipping diff."
            exit 0
          fi
          FIXTURE_ABS="$GITHUB_WORKSPACE/pr/tests/fixtures/85669NED/2026-03-11"
          cd base
          uv sync --locked --all-groups
          CAIRN_DUCKDB="$RUNNER_TEMP/base.duckdb" uv run dbt build \
            --project-dir transform --vars "{raw_dir: $FIXTURE_ABS}"
          uv run python scripts/export_mart.py "$RUNNER_TEMP/base.duckdb" "$RUNNER_TEMP/old.parquet"

      - name: Render benchmark diff
        run: |
          if [ "${{ steps.baseline.outputs.no_baseline }}" = "true" ]; then
            printf '### Benchmark diff\n\n_Baseline `main` has no mart yet; nothing to compare._\n' \
              > "$RUNNER_TEMP/diff.md"
          else
            cd pr
            uv run python scripts/benchmark_diff.py \
              "$RUNNER_TEMP/old.parquet" "$RUNNER_TEMP/new.parquet" -o "$RUNNER_TEMP/diff.md"
          fi

      - name: Find existing diff comment
        uses: peter-evans/find-comment@v3
        id: fc
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: github-actions[bot]
          body-includes: "Benchmark diff"
      - name: Post benchmark diff comment
        uses: peter-evans/create-or-update-comment@v4
        with:
          comment-id: ${{ steps.fc.outputs.comment-id }}
          issue-number: ${{ github.event.pull_request.number }}
          body-path: ${{ runner.temp }}/diff.md
          edit-mode: replace

  reproducibility:
    # Manual (workflow_dispatch) and weekly (schedule). Verifies every source's
    # real manifest snapshot (CBS, euets.info, EEA) against R2; skips gracefully
    # per source when it is unpinned or the secrets are absent.
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked --all-groups
      - name: Verify reproducibility
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: uv run python scripts/verify_reproducibility.py
