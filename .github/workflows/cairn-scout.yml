name: Cairn Scout

# Daily, cheap, read-only. Two jobs in one prompt:
#   1. Detect whether an upstream source published a new release (the freshness
#      signals are documented in CLAUDE.md: CBS 85669NED `Modified` date,
#      euets.info zip token, EEA datashare token) vs the pins in sources/*/manifest.yml.
#      Runs WEEKLY (Mondays) only â€” these sources update ~yearly, so daily
#      re-scraping is pure waste; the `freshness` step below gates it.
#   2. Dispatch the top of BACKLOG.md "Live candidates". Runs every day.
# Output is GitHub issues only â€” never code, never a PR. A human triages them and
# adds the `approved` label to hand one to Cairn Implement.

on:
  schedule:
    - cron: "17 6 * * *"   # daily 06:17 UTC (off the top of the hour; runners lag there)
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write
  id-token: write   # vereist: action haalt hiermee de OIDC-token op voor de Claude-app

concurrency:
  group: cairn-scout
  cancel-in-progress: true

env:
  # See cairn-implement.yml for the full rationale. AI_COST_PROJECT_NUMBER is
  # the small integer in the project's URL, not its GraphQL node ID.
  AI_COST_PROJECT_OWNER: ${{ github.repository_owner }}
  AI_COST_PROJECT_NUMBER: 1
  AI_COST_PROJECT_FIELD_NAME: "AI cost (USD)"

jobs:
  scout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      # Freshness probing (task 1) runs weekly (Mondays) or on manual dispatch;
      # the daily runs do backlog dispatch (task 2) only.
      - name: Decide whether to run the weekly freshness probe
        id: scope
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$(date -u +%u)" = "1" ]; then
            echo "freshness=true" >> "$GITHUB_OUTPUT"
          else
            echo "freshness=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Record run start time
        id: started
        run: echo "at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - uses: anthropics/claude-code-action@v1
        id: claude
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # --allowedTools REPLACES the action's default tool set, so list
          # everything the prompt needs â€” including TodoWrite (Claude Code's
          # default progress tracker); omitting any of it silently denies the
          # call and burns turns to error_max_turns. Bash is unrestricted
          # because scout probes release tokens with shell loops/functions
          # that prefix matching can't recognise (run 28053500486); with
          # contents:read and no file edits, it's read-only in effect.
          # mcp__github__create_issue is the bundled github-mcp-server's
          # actual tool name (issue_write does not exist and silently denies).
          # --add-dir /tmp lets Read/Grep follow scratch probe files.
          # show_full_output surfaces denied tool calls in the job log.
          # --model Sonnet: a mechanical freshness/duplicate check needs no
          # Opus-level judgement.
          show_full_output: true
          claude_args: >-
            --max-turns 20
            --add-dir /tmp
            --model claude-sonnet-4-6
            --allowedTools "Read,Glob,Grep,TodoWrite,WebFetch,WebSearch,Bash,mcp__github__list_issues,mcp__github__create_issue"
          prompt: |
            You are Cairn's daily scout. CLAUDE.md and BACKLOG.md are authoritative,
            but read narrowly: every turn re-sends the whole conversation so far, so
            a big upfront read inflates every later turn's cost. Do NOT edit any file
            and do NOT open a pull request.

            Scope for this run: FRESHNESS_PROBE=${{ steps.scope.outputs.freshness }}.
            Task 2 (backlog dispatch) runs every time. Run task 1 (upstream
            freshness) ONLY if FRESHNESS_PROBE is true; if it is false, skip task 1
            entirely â€” do not probe any upstream source, do not open a data-refresh
            issue, and do not read CLAUDE.md (it's only needed for task 1's
            checklists). For task 2, read only BACKLOG.md's "Live candidates" section,
            not the whole file. If FRESHNESS_PROBE is true, also read CLAUDE.md's
            "Recurring maintenance" runbooks (for task 1) â€” no need for the rest of
            either file.

            Two tasks:

            1. UPSTREAM FRESHNESS. For each source, compare the live upstream release
               token against the pin in its manifest, using the exact signals
               documented in CLAUDE.md's "Recurring maintenance" runbooks:
                 - CBS 85669NED: the OData `Properties` `Modified` date vs
                   sources/cbs/manifest.yml.
                 - euets.info: the current zip filename token vs sources/euets/manifest.yml.
                 - EEA bulk: the datashare token vs sources/eea/manifest.yml.
               Use curl, WebFetch, and read-only shell tools (grep/head/tail/file/
               unzip) to find the live token — no env build, no file edits in the
               repo. Scratch files (downloads, probes) may go in /tmp. If a source
               has a NEWER release than the pin, open ONE issue titled
               "data: <source> new release <token>",
               labelled `proposal` and `data-refresh`, body referencing the relevant
               CLAUDE.md checklist. If a similar open issue already exists, skip it.

            2. BACKLOG DISPATCH. Take the single highest item in BACKLOG.md "Live
               candidates" and dispatch it as one SMALL, single-layer issue that a
               single implement run can finish well inside its turn budget. Cairn's
               work splits along the repo's natural layers, in dependency order:
                 a. Ingestion + manifest â€” the pipeline script, a new
                    `sources/<name>/manifest.yml`, and the CI fixture.
                 b. dbt staging/mart model(s) + the dbt test(s) that guard them.
                 c. Evidence site and/or ESRS export integration.
               A candidate that only touches one layer is one issue. A candidate that
               spans several (e.g. a new source end-to-end) must NOT be dispatched as
               one big issue â€” it gets one issue per layer, and because each layer
               depends on the previous one having landed, open an issue ONLY for the
               next not-yet-done layer:
                 - Inspect the repo to see how far the candidate has progressed
                   (e.g. does `sources/<name>/manifest.yml` exist yet? the staging
                   model? the mart? the site query?). The first layer whose artifacts
                   are absent is the one to dispatch now.
                 - Skip the candidate entirely if that next layer already has an open
                   issue, or if the previous layer's PR is still open/unmerged (its
                   prerequisite hasn't landed â€” nothing to dispatch yet).
               Title the issue "feat: <candidate name> â€” <layer>" (e.g.
               "â€” ingestion", "â€” dbt mart", "â€” site"), labelled `proposal`. Scope the
               body to that layer ONLY: the slice of the backlog entry's
               value/effort/spine-fit and "watch" caveats relevant to it, the repo
               paths it touches, and which earlier layers it assumes are already
               merged. Do not restate the whole multi-layer feature as the task.

            Every issue body must open with a section headed "## Executive summary":
            2-4 plain-language sentences, written for a reader with no Cairn context,
            stating what happened and why it matters. Spell out every acronym or piece
            of internal jargon the first time it appears in that section (e.g. "CBS
            (Statistics Netherlands)", "EU ETS (the EU's Emissions Trading System)",
            "manifest (the append-only file that pins which source snapshot Cairn
            uses)"). The detailed technical body (checklist references, scoring,
            paths) follows below that section as today.

            Open at most 3 issues total. Before opening anything, list current open
            issues and skip duplicates. If nothing is new and the top candidate is
            already tracked, do nothing and say so.

      # Cost/usage visibility (CLAUDE.md "Action usage & cost dashboard"):
      # see cairn-implement.yml for the full rationale. always() because cost
      # is incurred whether or not the run finished cleanly.
      - name: Record action usage
        id: usage
        if: always() && steps.claude.outputs.execution_file != ''
        run: |
          uv run python scripts/record_action_usage.py \
            --execution-file "${{ steps.claude.outputs.execution_file }}" \
            --workflow cairn-scout \
            --summary-file "$GITHUB_STEP_SUMMARY" \
            --github-output "$GITHUB_OUTPUT"

      # Scout creates 0-3 issues per run with no single deterministic output
      # identifying them, unlike implement/replenish which know one issue/PR
      # up front. Find them via Search, bounded by this run's start time.
      - name: Find issues opened by this run
        id: opened
        if: always() && steps.usage.outputs.total_cost_usd != ''
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.search.issuesAndPullRequests({
              q: [
                `repo:${context.repo.owner}/${context.repo.repo}`,
                "is:issue",
                "label:proposal",
                `created:>=${{ steps.started.outputs.at }}`,
              ].join(" "),
            });
            core.setOutput("node_ids", data.items.map((i) => i.node_id).join(","));
            core.setOutput("numbers", JSON.stringify(data.items.map((i) => i.number)));

      - name: Comment usage on opened issues
        if: always() && steps.usage.outputs.total_cost_usd != '' && steps.opened.outputs.numbers != '[]'
        uses: actions/github-script@v7
        with:
          script: |
            const numbers = JSON.parse('${{ steps.opened.outputs.numbers }}');
            const body = [
              "**Claude action usage** (cairn-scout, run " +
                `[#${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})):`,
              `- model: \`${{ steps.usage.outputs.model }}\``,
              `- tokens: ${{ steps.usage.outputs.input_tokens }} in / ${{ steps.usage.outputs.output_tokens }} out`,
              `- cost: $${{ steps.usage.outputs.total_cost_usd }}`,
              `- turns: ${{ steps.usage.outputs.num_turns }}, duration: ${{ steps.usage.outputs.duration_ms }} ms`,
              "",
              "_Note: this run's full cost is attributed to each issue it opened this run; if multiple issues were opened, the cost shown is not split between them._",
            ].join("\n");
            for (const number of numbers) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: number,
                body,
              });
            }

      - name: Set AI cost project field
        if: always() && steps.usage.outputs.total_cost_usd != '' && steps.opened.outputs.node_ids != ''
        uses: actions/github-script@v7
        env:
          PROJECT_OWNER: ${{ env.AI_COST_PROJECT_OWNER }}
          PROJECT_NUMBER: ${{ env.AI_COST_PROJECT_NUMBER }}
          PROJECT_FIELD_NAME: ${{ env.AI_COST_PROJECT_FIELD_NAME }}
          CONTENT_NODE_IDS: ${{ steps.opened.outputs.node_ids }}
          COST_USD: ${{ steps.usage.outputs.total_cost_usd }}
        with:
          # Default GITHUB_TOKEN cannot write to a user/org-level Project; see
          # cairn-implement.yml for the full rationale on CAIRN_BOT_TOKEN.
          github-token: ${{ secrets.CAIRN_BOT_TOKEN }}
          script-path: .github/scripts/set_project_cost_field.mjs