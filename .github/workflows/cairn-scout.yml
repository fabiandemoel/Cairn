name: Cairn Scout

# Daily, cheap, read-only. Two jobs in one prompt:
#   1. Detect whether an upstream source published a new release (the freshness
#      signals are documented in CLAUDE.md: CBS 85669NED `Modified` date,
#      euets.info zip token, EEA datashare token) vs the pins in sources/*/manifest.yml.
#      Runs WEEKLY (Mondays) only â€” these sources update ~yearly, so daily
#      re-scraping is pure waste; the `freshness` step below gates it.
#   2. Dispatch the top of BACKLOG.md "Live candidates". Runs every day.
# Output is GitHub issues only â€” never code, never a PR. A human triages them and
# adds the `approved` label to hand one to Cairn Implement.

on:
  schedule:
    - cron: "17 6 * * *"   # daily 06:17 UTC (off the top of the hour; runners lag there)
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write
  id-token: write   # vereist: action haalt hiermee de OIDC-token op voor de Claude-app

concurrency:
  group: cairn-scout
  cancel-in-progress: true

jobs:
  scout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Freshness probing (task 1) runs weekly (Mondays) or on manual dispatch;
      # the daily runs do backlog dispatch (task 2) only.
      - name: Decide whether to run the weekly freshness probe
        id: scope
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$(date -u +%u)" = "1" ]; then
            echo "freshness=true" >> "$GITHUB_OUTPUT"
          else
            echo "freshness=false" >> "$GITHUB_OUTPUT"
          fi

      # Timestamp the run start: scout doesn't know which issue(s) it will open
      # (0-3 per run), so the cost step below resolves them via Search for issues
      # created since this moment.
      - name: Record run start
        id: run_start
        run: echo "ts=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      # Generate the repo-orientation map for the prompt. Backlog dispatch
      # (task 2) has to know how far a multi-layer candidate has progressed —
      # does its source manifest / staging model / mart / site query exist yet?
      # — to pick the next not-yet-done layer. Run logs showed scout spending
      # almost its whole turn budget re-deriving that inventory by listing
      # directories. The map (stdlib-only python3, scanned from the tree each
      # run so it never goes stale) hands it that layer inventory up front.
      - name: Generate repo orientation map
        id: orient
        run: |
          {
            echo 'map<<ORIENT_EOF'
            python3 scripts/repo_orientation.py
            echo
            echo 'ORIENT_EOF'
          } >> "$GITHUB_OUTPUT"

      # No-LLM: on freshness days, compare each source's live upstream release
      # token against its manifest pin and emit a ready-made table, so the agent
      # opens data-refresh issues for the sources marked STALE instead of
      # discovering tokens by hand. Run logs showed that discovery dominated a
      # scout run — euets.info has no upstream index, so the agent brute-forced
      # dozens of S3 filenames before concluding there was nothing to find (run
      # 28368467174: ~20 of 33 turns). check_freshness.py reads the live-vs-pin
      # constants from the pipeline files (never drifts) and treats euets as
      # human-watched. continue-on-error: a probe failure marks that source
      # "verify" and the agent falls back — an optimisation, not a gate.
      - name: Check upstream freshness
        id: freshness
        if: steps.scope.outputs.freshness == 'true'
        continue-on-error: true
        run: |
          {
            echo 'report<<FRESH_EOF'
            python3 scripts/check_freshness.py
            echo
            echo 'FRESH_EOF'
          } >> "$GITHUB_OUTPUT"

      # No-LLM saturation gate: backlog dispatch (task 2) is pointless when the
      # human-triage queue is already full, but scout still pays a whole run to
      # conclude "nothing to do". Count open `proposal` issues not yet `approved`;
      # if that is at/above the threshold AND this is not a freshness day, skip
      # the Claude step entirely (zero token cost that day). This self-regulates
      # dispatch to the real backlog depth — cheaper and more adaptive than a
      # fixed cadence. continue-on-error + a safe default (run on any failure).
      - name: Backlog saturation gate
        id: gate
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          THRESHOLD: ${{ vars.SCOUT_BACKLOG_SATURATION || '5' }}
        with:
          script: |
            const threshold = parseInt(process.env.THRESHOLD, 10) || 5;
            let untriaged = 0;
            try {
              const issues = await github.paginate(github.rest.issues.listForRepo, {
                owner: context.repo.owner, repo: context.repo.repo,
                state: 'open', labels: 'proposal', per_page: 100,
              });
              untriaged = issues.filter(
                (i) => !i.pull_request &&
                  !i.labels.some((l) => (typeof l === 'string' ? l : l.name) === 'approved'),
              ).length;
            } catch (err) {
              core.warning(`Saturation gate could not count issues, will not skip: ${err}`);
            }
            const saturated = untriaged >= threshold;
            core.info(`Open un-approved proposals: ${untriaged} (threshold ${threshold}) -> saturated=${saturated}`);
            core.setOutput('saturated', saturated ? 'true' : 'false');

      - id: claude
        # Run when there is real work: a freshness day (must probe), or a
        # dispatch day whose backlog is not already saturated. Skipping here is
        # the zero-cost path on a saturated, non-freshness day.
        if: steps.scope.outputs.freshness == 'true' || steps.gate.outputs.saturated != 'true'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # --allowedTools REPLACES the action's default tool set, so list
          # everything the prompt needs â€” including TodoWrite (Claude Code's
          # default progress tracker); omitting any of it silently denies the
          # call and burns turns to error_max_turns. Freshness is now
          # precomputed by the no-LLM step above, so scout should not probe
          # sources itself; Bash/WebFetch/WebSearch stay only for the rare
          # fallback when a probe row says it failed (with contents:read and no
          # file edits, it's read-only in effect).
          # mcp__github__create_issue is the bundled github-mcp-server's
          # actual tool name (issue_write does not exist and silently denies).
          # --add-dir /tmp lets Read/Grep follow scratch fallback files.
          # show_full_output surfaces denied tool calls in the job log.
          # --model Sonnet: a mechanical freshness/duplicate check needs no
          # Opus-level judgement.
          show_full_output: true
          claude_args: >-
            --max-turns 20
            --add-dir /tmp
            --model claude-sonnet-4-6
            --allowedTools "Read,Glob,Grep,TodoWrite,WebFetch,WebSearch,Bash,mcp__github__list_issues,mcp__github__create_issue"
          prompt: |
            You are Cairn's daily scout. CLAUDE.md and BACKLOG.md are authoritative,
            but read narrowly: every turn re-sends the whole conversation so far, so
            a big upfront read inflates every later turn's cost. Do NOT edit any file
            and do NOT open a pull request.

            Scope for this run: FRESHNESS_PROBE=${{ steps.scope.outputs.freshness }}.
            Task 2 (backlog dispatch) runs every time. Run task 1 (upstream
            freshness) ONLY if FRESHNESS_PROBE is true; if it is false, skip task 1
            entirely â€” do not probe any upstream source, do not open a data-refresh
            issue, and do not read CLAUDE.md (it's only needed for task 1's
            checklists). For task 2, read only BACKLOG.md's "Live candidates" section,
            not the whole file. If FRESHNESS_PROBE is true, also read CLAUDE.md's
            "Recurring maintenance" runbooks (for task 1) â€” no need for the rest of
            either file.

            ${{ steps.orient.outputs.map }}

            The orientation map's layer inventory above is authoritative for what
            already exists — use it for task 2 instead of re-listing directories.

            ${{ steps.freshness.outputs.report }}

            Two tasks:

            1. UPSTREAM FRESHNESS (only if FRESHNESS_PROBE is true). The freshness
               table above was already computed for you — it compared each source's
               live upstream release against its manifest pin. Do NOT probe any
               source yourself (no curl, no WebFetch, no guessing euets.info zip
               filenames — euets has no upstream index and is human-watched). Just
               act on the table: for each source marked **STALE**, open ONE issue
               titled "data: <source> new release <token>", labelled `proposal` and
               `data-refresh`, body referencing the relevant CLAUDE.md checklist —
               unless a similar open issue already exists, in which case skip it. If
               no source is marked STALE, open no data-refresh issue. (If the table
               is missing or a row says the probe failed, fall back to the
               CLAUDE.md "Recurring maintenance" signal for that one source only.)

            2. BACKLOG DISPATCH. Take the single highest item in BACKLOG.md "Live
               candidates" and dispatch it as one SMALL, single-layer issue that a
               single implement run can finish well inside its turn budget. Cairn's
               work splits along the repo's natural layers, in dependency order:
                 a. Ingestion + manifest â€” the pipeline script, a new
                    `sources/<name>/manifest.yml`, and the CI fixture.
                 b. dbt staging/mart model(s) + the dbt test(s) that guard them.
                 c. Evidence site and/or ESRS export integration.
               A candidate that only touches one layer is one issue. A candidate that
               spans several (e.g. a new source end-to-end) must NOT be dispatched as
               one big issue â€” it gets one issue per layer, and because each layer
               depends on the previous one having landed, open an issue ONLY for the
               next not-yet-done layer:
                 - Read the orientation map's layer inventory above to see how
                   far the candidate has progressed (does its
                   `sources/<name>/manifest.yml`, staging model, mart, or site
                   query already appear there?). The first layer whose artifacts
                   are absent is the one to dispatch now.
                 - Skip the candidate entirely if that next layer already has an open
                   issue, or if the previous layer's PR is still open/unmerged (its
                   prerequisite hasn't landed â€” nothing to dispatch yet).
               Title the issue "feat: <candidate name> â€” <layer>" (e.g.
               "â€” ingestion", "â€” dbt mart", "â€” site"), labelled `proposal`. Scope the
               body to that layer ONLY: the slice of the backlog entry's
               value/effort/spine-fit and "watch" caveats relevant to it, the repo
               paths it touches, and which earlier layers it assumes are already
               merged. Do not restate the whole multi-layer feature as the task.

            Every issue body must open with a section headed "## Executive summary":
            2-4 plain-language sentences, written for a reader with no Cairn context,
            stating what happened and why it matters. Spell out every acronym or piece
            of internal jargon the first time it appears in that section (e.g. "CBS
            (Statistics Netherlands)", "EU ETS (the EU's Emissions Trading System)",
            "manifest (the append-only file that pins which source snapshot Cairn
            uses)"). The detailed technical body (checklist references, scoring,
            paths) follows below that section as today.

            Open at most 3 issues total. Before opening anything, list current open
            issues and skip duplicates. If nothing is new and the top candidate is
            already tracked, do nothing and say so.

      # Cost visibility (best-effort; never fails the run). Parse the action's
      # execution_file into a markdown summary + the total cost in USD. Skipped
      # when the saturation gate skipped the Claude step — there is no cost to
      # report, and running it would risk a spurious comment on an unrelated
      # proposal issue created during the run window.
      - name: Summarise run cost
        id: cost
        if: always() && steps.claude.outcome != 'skipped'
        run: |
          python3 scripts/ai_cost_summary.py \
            --execution-file "${{ steps.claude.outputs.execution_file }}" \
            --label "Cairn Scout" \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            -o "${{ runner.temp }}/ai_cost.md"

      # Resolve the issue(s) this run opened (0-3) via Search since run start,
      # then post the cost comment and set the Projects v2 Number field on each.
      # A multi-issue run sets the full run cost on each (accepted double-count).
      - name: Attribute run cost
        if: always() && steps.claude.outcome != 'skipped'
        uses: actions/github-script@v7
        env:
          RUN_START: ${{ steps.run_start.outputs.ts }}
          COMMENT_PATH: ${{ runner.temp }}/ai_cost.md
          COST_USD: ${{ steps.cost.outputs.cost_usd }}
          PROJECTS_TOKEN: ${{ secrets.PROJECTS_TOKEN || secrets.CAIRN_BOT_TOKEN || github.token }}
          PROJECT_OWNER: ${{ vars.AI_COST_PROJECT_OWNER || 'fabiandemoel' }}
          PROJECT_NUMBER: ${{ vars.AI_COST_PROJECT_NUMBER || '1' }}
          FIELD_NAME: ${{ vars.AI_COST_FIELD_NAME || 'AI cost (USD)' }}
        with:
          # Comment via GITHUB_TOKEN: this workflow's `permissions:` grants it
          # issues: write, whereas the CAIRN_BOT_TOKEN PAT (scoped for opening
          # PRs) lacks issue access. The Projects v2 calls use PROJECTS_TOKEN.
          github-token: ${{ github.token }}
          script: |
            const fs = require('fs');
            const path = require('path');
            const attribute = require(path.resolve('.github/scripts/attribute_run_cost.js'));

            // Scout's issues are all labelled `proposal`; find the ones created
            // since run start. Search indexing lags a few seconds, so retry once.
            const q = `repo:${context.repo.owner}/${context.repo.repo} is:issue `
              + `label:proposal created:>=${process.env.RUN_START}`;
            async function search() {
              const res = await github.rest.search.issuesAndPullRequests({ q, per_page: 10 });
              return res.data.items.map((i) => i.number);
            }
            let targets = await search();
            if (targets.length === 0) {
              await new Promise((r) => setTimeout(r, 15000));
              targets = await search();
            }

            let commentBody = '';
            try { commentBody = fs.readFileSync(process.env.COMMENT_PATH, 'utf8'); } catch (e) {}

            await attribute({
              github, context, core, targets, commentBody,
              costUsd: process.env.COST_USD,
              projectOwner: process.env.PROJECT_OWNER,
              projectNumber: parseInt(process.env.PROJECT_NUMBER, 10),
              fieldName: process.env.FIELD_NAME,
              projectsToken: process.env.PROJECTS_TOKEN,
            });