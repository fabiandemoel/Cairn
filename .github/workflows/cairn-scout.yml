name: Cairn Scout

# Daily, cheap, read-only. Two jobs in one prompt:
#   1. Detect whether an upstream source published a new release (the freshness
#      signals are documented in CLAUDE.md: CBS 85669NED `Modified` date,
#      euets.info zip token, EEA datashare token) vs the pins in sources/*/manifest.yml.
#   2. Dispatch the top of BACKLOG.md "Live candidates".
# Output is GitHub issues only â€” never code, never a PR. A human triages them and
# adds the `approved` label to hand one to Cairn Implement.

on:
  schedule:
    - cron: "17 6 * * *"   # daily 06:17 UTC (off the top of the hour; runners lag there)
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write
  id-token: write   # vereist: action haalt hiermee de OIDC-token op voor de Claude-app

concurrency:
  group: cairn-scout
  cancel-in-progress: true

jobs:
  scout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Cheap and (mostly) read-only, but freshness checks need real probing:
          # scraping euets.info's download page, parsing its JS for the current
          # zip token, grepping headers for the EEA datashare token. --allowedTools
          # REPLACES the action's default tool set rather than extending it, so
          # everything the prompt below actually needs must be listed explicitly,
          # including TodoWrite (Claude Code's own progress tracker, used by
          # default on every multi-step run) — leaving any of it out means every
          # attempt gets silently denied and the run burns turns retrying before
          # hitting --max-turns (error_max_turns, exit code 1).
          # Bash is allowed unrestricted (not per-command, e.g. `Bash(curl:*)`):
          # scout probes release tokens with shell loops and helper functions
          # (`for tok in ...; do ...`, `probe() { ... }`), and a prefix-matched
          # allowlist can't recognise those as the underlying command — every
          # such attempt was denied, burning turns
          # (https://github.com/fabiandemoel/Cairn/actions/runs/28053500486).
          # The job has no write permissions at the GitHub Actions level
          # (`permissions.contents: read` above) and the prompt forbids file
          # edits, so unrestricted Bash here is read-only in effect.
          # mcp__github__create_issue is the actual tool name exposed by the
          # action's bundled github-mcp-server — an earlier allowlist entry of
          # `mcp__github__issue_write` (a different, non-existent tool name)
          # silently denied every issue-creation attempt; same run above.
          # --add-dir /tmp lets Read/Grep follow scratch files (probe
          # downloads, unzip listings) without widening write access elsewhere.
          # show_full_output prints the full SDK conversation (including which
          # tool calls get denied) so a failure's cause is visible in the job
          # log directly, without a separate debugging pass.
          show_full_output: true
          claude_args: >-
            --max-turns 20
            --add-dir /tmp
            --allowedTools "Read,Glob,Grep,TodoWrite,WebFetch,WebSearch,Bash,mcp__github__list_issues,mcp__github__create_issue"
          prompt: |
            You are Cairn's daily scout. Read CLAUDE.md and BACKLOG.md first; they
            are authoritative. Do NOT edit any file and do NOT open a pull request.

            Two tasks:

            1. UPSTREAM FRESHNESS. For each source, compare the live upstream release
               token against the pin in its manifest, using the exact signals
               documented in CLAUDE.md's "Recurring maintenance" runbooks:
                 - CBS 85669NED: the OData `Properties` `Modified` date vs
                   sources/cbs/manifest.yml.
                 - euets.info: the current zip filename token vs sources/euets/manifest.yml.
                 - EEA bulk: the datashare token vs sources/eea/manifest.yml.
               Use curl, WebFetch, and read-only shell tools (grep/head/tail/file/
               unzip) to find the live token — no env build, no file edits in the
               repo. Scratch files (downloads, probes) may go in /tmp. If a source
               has a NEWER release than the pin, open ONE issue titled
               "data: <source> new release <token>",
               labelled `proposal` and `data-refresh`, body referencing the relevant
               CLAUDE.md checklist. If a similar open issue already exists, skip it.

            2. BACKLOG DISPATCH. Take the single highest item in BACKLOG.md "Live
               candidates" that has no corresponding open issue. Open ONE issue
               titled "feat: <candidate name>", labelled `proposal`, summarising the
               candidate, its value/effort/spine-fit, the "watch" caveats, and the
               repo paths it touches â€” straight from the backlog entry.

            Open at most 3 issues total. Before opening anything, list current open
            issues and skip duplicates. If nothing is new and the top candidate is
            already tracked, do nothing and say so.