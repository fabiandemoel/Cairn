name: Cairn Implement

# Runs only when YOU label an issue `approved` (or via manual dispatch with an
# issue number). It implements that one issue on a branch and opens a PR against
# main. It does NOT merge. Your existing CI (lint, test, dbt-build, evidence-build,
# benchmark-diff) is the gate; you review the benchmark diff and merge.
#
# IMPORTANT â€” token: the PR must be opened with a PAT / GitHub-App token
# (secrets.CAIRN_BOT_TOKEN), NOT the default GITHUB_TOKEN. GitHub deliberately does
# not fire workflows for events created by GITHUB_TOKEN, so a PR opened with it
# would skip ci.yml and you'd lose the gate. Create a fine-grained PAT (contents +
# pull_requests: write) or use the app token from `/install-github-app`, and store
# it as CAIRN_BOT_TOKEN. Confirm the action's token input name against its README.

on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Issue number to implement"
        required: true

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read

concurrency:
  group: cairn-implement
  cancel-in-progress: false

jobs:
  implement:
    # Only the `approved` label triggers this; ignore every other label event.
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.label.name == 'approved'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.CAIRN_BOT_TOKEN }}

      # Toolchain available + cached so Claude's build/test commands are fast.
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: site/package-lock.json

      # Fetch the issue once; its title/labels/body feed the strategy step,
      # every priming step below, and the prompt. The model/plan routing
      # itself is decided by the unit-tested strategy step that follows, not
      # here. Falls back to empty outputs (=> Sonnet, no plan step) if the
      # issue can't be read.
      - name: Fetch issue title, labels and body
        id: issue
        uses: actions/github-script@v7
        with:
          script: |
            const issueNumber = ${{ github.event.issue.number || github.event.inputs.issue_number }};
            let title = "";
            let labelsCsv = "";
            let body = "";
            try {
              const { data: issue } = await github.rest.issues.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
              });
              const labels = issue.labels.map(l => (typeof l === "string" ? l : l.name));
              labelsCsv = labels.join(",");
              title = issue.title || "";
              body = issue.body || "";
              core.info(`Issue #${issueNumber} labels: ${labelsCsv}`);
            } catch (err) {
              core.warning(`Could not read issue #${issueNumber}: ${err}`);
            }
            // title/labels feed the strategy and per-layer reference steps,
            // and title/labels/body feed the layer-scaffold step; on a read
            // failure they stay empty and every consumer falls back to its
            // conservative default rather than crashing.
            core.setOutput("title", title);
            core.setOutput("labels", labelsCsv);
            core.setOutput("body", body);

      # No-LLM routing (scripts/implement_strategy.py, unit-tested): which
      # model runs the orchestrator, and whether an isolated read-only Sonnet
      # plan step runs first. data-refresh (fixed checklist) and staging
      # (scaffolded near-copy of the exemplar) run Haiku alone; ingestion and
      # unclassifiable issues keep the Sonnet orchestrator; every other feat
      # layer (mart / site / fused mart+site / export) gets a Sonnet-written
      # plan and a Haiku orchestrator. Cost data (PRs #121/#122) showed the
      # Sonnet orchestrator was ~84% of a feat run's cost, nearly all of it
      # execution turns Haiku can drive once the design is settled.
      - name: Decide orchestrator model and plan step
        id: strategy
        env:
          ISSUE_TITLE: ${{ steps.issue.outputs.title }}
          ISSUE_LABELS: ${{ steps.issue.outputs.labels }}
        run: >-
          python3 -m scripts.implement_strategy gate
          --title "$ISSUE_TITLE" --labels "$ISSUE_LABELS"
          >> "$GITHUB_OUTPUT"

      # Timestamp the run start so the cost step can find the PR this run opens
      # (branch agent/<issue>-*) without grabbing an older one.
      - name: Record run start
        id: run_start
        run: echo "ts=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      # No-LLM baseline: knowing upfront whether ci.yml is currently green on
      # main means the agent never needs to git-stash/checkout main itself to
      # tell "I broke this" apart from "this was already broken" — that
      # stash/pop round trip (done inline, mid-debugging) was itself a cost
      # driver on run 28267511721. A stale/unknown baseline just falls back to
      # the agent checking directly, so this is a pure cost optimization, not
      # a correctness dependency.
      - name: Check latest CI status on main
        id: main_ci
        uses: actions/github-script@v7
        with:
          script: |
            let conclusion = "unknown", sha = "unknown", url = "";
            try {
              const { data } = await github.rest.actions.listWorkflowRuns({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: "ci.yml",
                branch: "main",
                status: "completed",
                per_page: 1,
              });
              const run = data.workflow_runs[0];
              if (run) {
                conclusion = run.conclusion;
                sha = run.head_sha.substring(0, 7);
                url = run.html_url;
              }
            } catch (err) {
              core.warning(`Could not fetch main's CI status: ${err}`);
            }
            core.setOutput("conclusion", conclusion);
            core.setOutput("sha", sha);
            core.setOutput("url", url);

      # Pre-build the environment so the agent starts from a VERIFIED-green tree
      # instead of re-discovering and rebuilding it turn by turn. After
      # installing deps we run scripts/verify.sh — the same one-shot wrapper
      # `runner` uses — which runs ci.yml's whole gate (ruff, sqlfluff, pytest,
      # dbt build -> ./cairn.duckdb, the ESRS export -> the site download bundle,
      # and build:strict). Run logs showed the bulk of an implement run's turns
      # went to re-deriving exactly this — does cairn.duckdb exist? why does
      # build:strict 404 on the export download? — all eliminated by having it
      # already done AND confirmed green, with every cache (dbt, npm, Evidence)
      # warm for the agent's later re-verify. Using verify.sh here keeps this
      # step and runner on one definition of the sequence. continue-on-error: a
      # red main just falls back to the agent building it itself — a pure cost
      # optimization, not a correctness gate.
      - name: Pre-build environment (deps + verified-green baseline)
        continue-on-error: true
        run: |
          uv sync --locked --all-groups
          (cd site && npm ci)
          scripts/verify.sh

      # Generate the repo-orientation map and capture it for the prompt. Uses
      # plain python3 (the script is stdlib-only) so it works even if the
      # pre-build step above failed. The map lists the stable facts every run
      # was re-discovering: the build sequence, the warehouse/Evidence wiring,
      # and the current layer inventory (which sources/models/site queries
      # exist). It is scanned from the tree each run, so it never goes stale.
      - name: Generate repo orientation map
        id: orient
        run: |
          {
            echo 'map<<ORIENT_EOF'
            python3 scripts/repo_orientation.py
            echo
            echo 'ORIENT_EOF'
          } >> "$GITHUB_OUTPUT"

      # No-LLM: inline the canonical exemplar(s) for THIS issue's layer so the
      # agent starts with the exact pattern to copy already in context, instead
      # of spending many turns reading (and re-reading) the reference files to
      # re-derive it — the dominant cost in run logs (run 28391012503 spent 42 of
      # 73 tool calls on recon before writing a line). The layer is inferred from
      # the issue title/labels; an unknown layer or a missing exemplar degrades
      # to a "find the closest example" note, so this is a pure cost
      # optimization, never a correctness gate. Scanned from the tree each run,
      # so the template never goes stale.
      - name: Generate canonical reference for the issue's layer
        id: reference
        env:
          ISSUE_TITLE: ${{ steps.issue.outputs.title }}
          ISSUE_LABELS: ${{ steps.issue.outputs.labels }}
        run: |
          {
            echo 'ref<<REF_EOF'
            python3 scripts/reference_for_layer.py --title "$ISSUE_TITLE" --labels "$ISSUE_LABELS"
            echo
            echo 'REF_EOF'
          } >> "$GITHUB_OUTPUT"

      # No-LLM: for an ingestion/staging issue whose body carries a
      # "Scaffold parameters" source/dataset slug block (written by the no-LLM
      # dispatcher from the candidate's BACKLOG.md dispatch block), pre-write the fixed
      # boilerplate that layer's exemplar above shows (scaffold_ingestion.py /
      # scaffold_staging.py) so the agent starts editing TODO markers instead of
      # typing the plumbing from scratch. A mart/site/export/data-refresh issue,
      # a missing/malformed slug block, or a target that already exists (partial
      # progress from an earlier run) all degrade to an explanatory note (or no
      # note at all) rather than touching the tree -- run as a module
      # (`-m scripts.scaffold_for_layer`, not `scripts/scaffold_for_layer.py`)
      # because it cross-imports the other scaffold_*.py modules, which only
      # resolve as a package when the repo root is on sys.path. This is a cost
      # optimisation, never a correctness gate: it never fails the job, and its
      # absence just reproduces today's copy-the-exemplar behaviour.
      - name: Scaffold this issue's layer (if applicable)
        id: scaffold
        continue-on-error: true
        env:
          ISSUE_TITLE: ${{ steps.issue.outputs.title }}
          ISSUE_LABELS: ${{ steps.issue.outputs.labels }}
          ISSUE_BODY: ${{ steps.issue.outputs.body }}
        run: |
          {
            echo 'note<<SCAFFOLD_EOF'
            python3 -m scripts.scaffold_for_layer --title "$ISSUE_TITLE" --labels "$ISSUE_LABELS" --body "$ISSUE_BODY"
            echo
            echo 'SCAFFOLD_EOF'
          } >> "$GITHUB_OUTPUT"

      # TWO-STEP SPLIT: live-source discovery happens HERE, before the
      # orchestrator, in an isolated Haiku step — not mid-run in a subagent.
      # Prompt-only enforcement of "do discovery in one synchronous legwork
      # task" failed twice in a row (runs 28586826555/#42 and 28621307833/#43:
      # the orchestrator parked discovery in background subagents, scheduled a
      # ScheduleWakeup that can never fire in a one-shot CI job, and ended its
      # turn having shipped nothing — a false-green the ship-guard then failed).
      # With the brief generated up front and injected into the implement
      # prompt like the orientation map, there is nothing mid-run to wait on,
      # the implement step carries no WebFetch/WebSearch at all, and the
      # discovery tokens are priced at Haiku rates.
      #
      # The gate is no-LLM (scripts/source_research.py): only an
      # ingestion-layer issue needs live research — staging/mart/site/export
      # work from the committed fixtures and the tree, and data-refresh
      # pipelines self-detect their release. Everything here is
      # continue-on-error / degradable: a failed or empty brief becomes a
      # fallback note telling the orchestrator how to proceed without one.
      - name: Gate live-source research
        id: research_gate
        env:
          ISSUE_TITLE: ${{ steps.issue.outputs.title }}
          ISSUE_LABELS: ${{ steps.issue.outputs.labels }}
          ISSUE_BODY: ${{ steps.issue.outputs.body }}
        run: >-
          python3 -m scripts.source_research gate
          --title "$ISSUE_TITLE" --labels "$ISSUE_LABELS" --body "$ISSUE_BODY"
          >> "$GITHUB_OUTPUT"

      - name: Research the live source (isolated Haiku step)
        id: research
        if: steps.research_gate.outputs.needed == 'true'
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.CAIRN_BOT_TOKEN }}
          show_full_output: true
          # WebFetch/WebSearch only: no shell, no files, no subagents — this
          # step can observe the web and report, nothing else. ScheduleWakeup
          # is disallowed explicitly because it bypasses the allowlist
          # (harness-internal; run #43 called it without it being allowed).
          claude_args: >-
            --max-turns 25
            --model claude-haiku-4-5-20251001
            --allowedTools "WebFetch,WebSearch"
            --disallowedTools "ScheduleWakeup,TaskCreate,TaskUpdate,TaskGet,TaskList,TaskOutput,TaskStop,SendMessage"
          prompt: |
            You are the research-only front half of a two-step pipeline. A separate
            implementation agent — which has NO web access — will receive your FINAL
            MESSAGE verbatim as its only knowledge of the live data source. You have
            only WebFetch and WebSearch: no shell, no file access, no subagents. If a
            tool is denied, that is terminal — do not retry or wait, work with what
            you have.

            Context: the repository is Cairn, a provenance-first emissions data
            warehouse over official EU/NL sources (pinned snapshots, append-only
            manifests, idempotent ingest pipelines). The issue below asks for a new
            ingestion pipeline. Investigate the source it names and write a
            self-contained factual brief covering:

            1. The machine-readable data endpoint(s): exact download URL(s), file
               format (CSV/xlsx/zip/JSON/API), and how to fetch non-interactively.
               If the source is a catalogue of datasets (CBS StatLine, Eurostat,
               a CKAN/data-portal), FIRST identify the exact dataset/table id in
               that catalogue (e.g. the CBS `NNNNNED` table id) and verify it
               resolves against the live API — this id is the one fact the
               implementation agent cannot proceed without.
            2. The release/version token: the filename part, metadata field, or
               last-update date that identifies a release, usable as an idempotency
               pin (the pipeline exits "no new release" when it matches the manifest).
            3. The column layout: names, types, and meaning, as actually observed in
               the data or its official documentation.
            4. The code values that matter: total/aggregate rows or codes, units,
               country/sector code systems — whatever filtering or reconciliation
               will need.
            5. 5-10 representative data rows if you can see them (as a CSV block).
            6. Quirks: auth walls, portals without a fetchable API, redirects, cookie
               gates — anything that changes how a pipeline must fetch this.

            Issue #${{ github.event.issue.number || github.event.inputs.issue_number }},
            titled "${{ steps.issue.outputs.title }}":

            <issue-body>
            ${{ steps.issue.outputs.body }}
            </issue-body>

            URLs found in the issue body (may be empty; verify, don't assume):
            ${{ steps.research_gate.outputs.urls }}

            Rules: report only what you actually observed — never invent URLs,
            columns, or values; mark anything you could not verify as UNVERIFIED.
            Your final message must be the brief itself: no preamble, no planning
            narration, under ~120 lines.

      # Extract the research step's final message from its execution log and
      # wrap it as the markdown section the implement prompt inlines. Missing/
      # failed research degrades to a fallback note (never fails the job).
      - name: Capture research brief
        id: research_brief
        if: steps.research_gate.outputs.needed == 'true'
        env:
          EXECUTION_FILE: ${{ steps.research.outputs.execution_file }}
        run: |
          {
            echo 'brief<<BRIEF_EOF'
            python3 -m scripts.source_research brief --execution-file "$EXECUTION_FILE"
            echo
            echo 'BRIEF_EOF'
          } >> "$GITHUB_OUTPUT"

      # The new-source implementation guidance (manifest / --offline / blocker-
      # draft rules) is only meaningful for an ingestion issue -- the same gate
      # that fires the research step. Emit it into the prompt only then, so a
      # mart/site/export/data-refresh run does not carry ~17 lines of
      # ingestion-only instructions in every one of its turns. Skipped -> empty
      # output -> the prompt's injection line renders blank.
      - name: New-source guidance (ingestion issues only)
        id: ingestion_guidance
        if: steps.research_gate.outputs.needed == 'true'
        run: |
          {
            echo 'guidance<<GUIDE_EOF'
            cat .github/claude/new_source_guidance.md
            echo
            echo 'GUIDE_EOF'
          } >> "$GITHUB_OUTPUT"

      # TWO-STEP PLAN->EXECUTE SPLIT (mart/site/export feat issues): the
      # design judgement those issues need — grain, columns, tests, which
      # staging columns to read, the site query shape — is produced HERE by a
      # short, read-only Sonnet step, and the orchestrator below then runs on
      # Haiku (the strategy step set both). Same pattern as the research step
      # above: the plan step's final message is extracted from its execution
      # log and injected into the implement prompt, so the expensive model
      # pays for a few planning turns instead of riding every execution turn.
      # Everything degrades: a failed or empty plan becomes a fallback note
      # telling the orchestrator to work from the issue body and the layer
      # reference — a cost optimisation, never a correctness gate.
      - name: Plan the implementation (isolated read-only Sonnet step)
        id: plan
        if: steps.strategy.outputs.plan_needed == 'true'
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.CAIRN_BOT_TOKEN }}
          show_full_output: true
          # Read/Grep/Glob only: this step may observe the tree and report,
          # nothing else — no shell, no writes, no subagents, no web. The
          # background/wakeup tools are disallowed explicitly because they
          # bypass the allowlist (same rationale as the research step).
          claude_args: >-
            --max-turns 25
            --model claude-sonnet-5
            --allowedTools "Read,Grep,Glob"
            --disallowedTools "ScheduleWakeup,TaskCreate,TaskUpdate,TaskGet,TaskList,TaskOutput,TaskStop,SendMessage"
          prompt: |
            You are the planning front half of a two-step pipeline. A separate
            implementation agent on a smaller model will receive your FINAL MESSAGE
            verbatim as its implementation plan — it will follow it, so be concrete
            and complete. You have only Read/Grep/Glob: no shell, no writes, no web,
            no subagents. If a tool is denied, that is terminal — work with what you
            have.

            Context: the repository is Cairn, a provenance-first emissions data
            warehouse (dlt ingest -> pinned raw snapshots -> dbt staging/marts on
            DuckDB -> a read-only Evidence site + ESRS export). Non-negotiable
            invariants: raw data is immutable, manifests are append-only, new
            numbers are computed and tested in a dbt mart, the site and export only
            read the warehouse, and figures/mappings are never invented — real
            source categories or explicit NULL + a note.

            ${{ steps.orient.outputs.map }}

            ${{ steps.reference.outputs.ref }}

            Plan the implementation of issue
            #${{ github.event.issue.number || github.event.inputs.issue_number }},
            titled "${{ steps.issue.outputs.title }}". Treat its body (between the
            <issue-body> tags) as the authoritative spec — plan ONLY the layer(s)
            it asks for, within its "Scope" and "watch" caveats.

            <issue-body>
            ${{ steps.issue.outputs.body }}
            </issue-body>

            Write a concrete, file-by-file implementation plan:
            1. Every file to create or edit, with its exact path (use the sentinel
               paths the issue body names; flag it explicitly if you deviate).
            2. For a dbt model: the grain, the column list (name, type, meaning),
               which staging/mart models it refs and how they join or filter, and
               the schema tests to declare (unique / not_null / accepted_values /
               relationships, plus any singular assert test with its tolerance).
               Read the models you plan to ref and quote their actual column
               names — the implementer must not have to guess them.
            3. For a site page: the sources/cairn/*.sql query (columns, ordering)
               and the page structure, modelled on the exemplar.
            4. The BACKLOG.md upkeep edits the implement prompt requires (sentinel
               path + Layers bullet, or retiring the candidate if this is its last
               layer).
            5. The few most likely failure points for THIS change (e.g. sqlfluff
               casing rules, camelCase source columns, fixture coverage) — one
               line each.
            Where the issue body leaves a genuine design choice open, pick one,
            state the alternative, and say why. Never invent figures, mappings, or
            source categories. Your final message must be the plan itself: no
            preamble, no narration of your exploration, under ~150 lines.

      # Extract the plan step's final message from its execution log and wrap
      # it as the markdown section the implement prompt inlines. A missing/
      # failed plan degrades to a fallback note (never fails the job).
      - name: Capture implementation plan
        id: plan_brief
        if: steps.strategy.outputs.plan_needed == 'true'
        env:
          EXECUTION_FILE: ${{ steps.plan.outputs.execution_file }}
        run: |
          {
            echo 'plan<<PLAN_EOF'
            python3 -m scripts.implement_strategy plan --execution-file "$EXECUTION_FILE"
            echo
            echo 'PLAN_EOF'
          } >> "$GITHUB_OUTPUT"

      # Shrink the CLAUDE.md the implement agent reads. The prompt has the agent
      # read CLAUDE.md (invariants in full, the per-source checklist for a
      # data-refresh), and every token it reads rides in every later turn -- the
      # dominant repeated cost in the run logs. This strips the long "Agent
      # automation (CI maintenance loop)" section (workflow-internals: dispatch/
      # replenish/implement/cost-attribution) -- the largest single block and
      # irrelevant to implementing any one issue -- from the EPHEMERAL checkout
      # only, cutting ~35% of that file's context weight while leaving the
      # invariants, the recurring-maintenance checklists, and the Gotchas intact.
      # The committed CLAUDE.md is never touched: assume-unchanged keeps the
      # overwrite out of any commit/stash runner makes. Generated from the tree
      # (scripts/claude_md_for_implement.py, unit-tested) so it can't drift; a
      # renamed heading degrades to an unchanged copy. continue-on-error: a
      # failure just falls back to the full file -- a cost optimisation, not a
      # gate, like the other priming steps.
      - name: Trim CLAUDE.md for the implement run
        continue-on-error: true
        env:
          ISSUE_LABELS: ${{ steps.issue.outputs.labels }}
        run: |
          # A data-refresh run greps CLAUDE.md for its per-source checklist, so
          # keep those (data-refresh profile). A feat run implements one new
          # layer and never runs a refresh, so it also drops the per-source
          # "### When ..." checklists (feat profile: ~65% lighter than the full
          # file vs ~36% for data-refresh).
          PROFILE=feat
          case ",${ISSUE_LABELS}," in *,data-refresh,*) PROFILE=data-refresh ;; esac
          echo "CLAUDE.md trim profile: $PROFILE"
          python3 scripts/claude_md_for_implement.py --profile "$PROFILE" > CLAUDE.implement.md
          mv CLAUDE.implement.md CLAUDE.md
          git update-index --assume-unchanged CLAUDE.md

      - id: claude
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.CAIRN_BOT_TOKEN }}
          # show_full_output surfaces denied tool calls in the job log.
          #
          # --allowedTools is required: claude-code-action ships no default
          # allowlist, so with none set every tool call is denied and the run
          # still reports success â€” a quiet false-green where the agent just
          # explains it's blocked (run 28079588272).
          #
          # ORCHESTRATOR/EXECUTOR SPLIT. This Claude is the *orchestrator*: it
          # reads the spec, authors file edits (Read/Write/Edit), and decides,
          # then delegates via Task to the `runner` subagent for all command
          # execution (uv/dbt/npm/ruff/sqlfluff/pytest + git stage/commit/push)
          # and to the `legwork` subagent for all bulk search / live-source
          # discovery â€” each runs in its OWN conversation
          # (.claude/agents/{runner,legwork}.md, both pinned to Haiku). The point
          # is context isolation: a 30-turn build/test/debug loop inside a
          # subagent collapses to one summary in the orchestrator's context
          # instead of riding in every later turn. Run 28447652743 spent
          # $5.67 / 82 turns with 6.86M cache-read tokens, almost entirely an
          # inline debug loop re-sent each turn; this split moves that loop out
          # of the expensive orchestrator context.
          #
          # WHY Bash IS listed here even though the orchestrator must not call
          # it directly: --allowedTools is the SESSION-WIDE permission
          # allowlist, and subagents inherit it â€” a subagent's frontmatter
          # `tools:` only restricts WHICH tools it may attempt, it does NOT
          # grant permission. A tool absent from this list is denied for
          # EVERYONE, including `runner`/`legwork`. Dropping Bash here to
          # "enforce" the split (commit f7a3c94) is exactly what broke run
          # 28517372275: `runner`'s git writes came back "requires approval",
          # so the run shipped nothing and the ship-guard failed. So Bash MUST
          # stay listed; the split is enforced by the prompt + subagent
          # definitions, not by withholding the tool from the allowlist.
          #
          # WebFetch/WebSearch are deliberately ABSENT now: live-source
          # discovery moved to the isolated research step above, so no subagent
          # needs the web anymore (legwork's frontmatter dropped WebFetch in
          # the same change). This is mechanical enforcement of the two-step
          # split — with the tools gone, mid-run web exploration cannot happen.
          #
          # --disallowedTools blocks the background/wakeup tools the allowlist
          # cannot: ScheduleWakeup is harness-internal and bypasses
          # --allowedTools (run 28621307833/#43 called it while unlisted, then
          # ended its turn "waiting" on a wakeup that can never fire in a
          # one-shot CI job). The agent-messaging/background-task tools are
          # blocked for the same reason: prompt-only "stay synchronous" failed
          # in runs #42 and #43, so it is now enforced at the harness level.
          # mcp__github__get_issue / mcp__github__create_pull_request are the
          # bundled github-mcp-server's actual tool names (run 28085542460);
          # guessing wrong (issue_read, issue_write) silently denies them.
          # get_issue is only a fallback now - the model step already fetches
          # the issue and the prompt inlines its title/body, saving the
          # fetch turn every run started with.
          #
          # --max-turns 100: a full new-source slice (ingestion + mart + test
          # + site) needs room; 20 then 60 both hit error_max_turns mid-work
          # (runs 28085542460, 28173119243). --model sets the ORCHESTRATOR model,
          # decided by the strategy step above (scripts/implement_strategy.py):
          # Sonnet for ingestion/unclassifiable issues, Haiku for data-refresh,
          # staging, and the plan-backed mart/site/export issues (a read-only
          # Sonnet plan step already settled the design for those). The runner
          # and legwork subagents are pinned to Haiku regardless.
          show_full_output: true
          claude_args: >-
            --max-turns 100
            --model ${{ steps.strategy.outputs.model }}
            --allowedTools "Read,Write,Edit,Glob,Grep,TodoWrite,Task,Bash,mcp__github__get_issue,mcp__github__create_pull_request,mcp__github__list_pull_requests"
            --disallowedTools "ScheduleWakeup,TaskCreate,TaskUpdate,TaskGet,TaskList,TaskOutput,TaskStop,SendMessage"
          prompt: |
            CLAUDE.md and BACKLOG.md are authoritative and override this prompt, but
            they are long, so read them narrowly -- a big upfront read inflates
            every later turn. Read CLAUDE.md's "Non-negotiable invariants" in full.
            For a `data-refresh` issue, grep CLAUDE.md for that source's "Recurring
            maintenance" checklist and read only that. For a `feat` issue, the issue
            body already quotes the BACKLOG.md candidate entry verbatim -- do NOT
            re-read the entry in BACKLOG.md (open BACKLOG.md only for the upkeep
            edit below, or if the body lacks the quoted entry because the issue was
            written by hand). Consult "Gotchas" only when you hit something it covers.

            EXECUTION MODEL - read this first. You are the ORCHESTRATOR: you read
            files, author edits (Write/Edit), and make every decision. You do NOT act
            on the world yourself. Bash appears in your allowlist ONLY so your
            subagents can use it - you must NOT call it directly: routing a command
            through a subagent is a hard rule, not a preference, because a subagent's
            many turns of output stay in its own context instead of riding in every
            later turn of yours (that re-sent context is the dominant cost). You have
            NO web access at all this run (WebFetch/WebSearch are not in the
            allowlist): live-source discovery, when this issue needed it, already
            happened in an isolated research step whose brief is inlined below. You
            also have NO create_branch / push_files
            tools; your only github MCP tools are get_issue, create_pull_request, and
            list_pull_requests. Every action runs in a separate subagent conversation
            via the Task tool:
              - `runner` (subagent_type: runner) runs ALL shell commands and git: the
                whole CI gate via `scripts/verify.sh` (ruff, sqlfluff, pytest, `dbt
                build`, the ESRS export, `npm run build:strict`, in the right order)
                and every git op (stage the files you wrote, commit, push). On a
                failing command it iterates in its own context to find the root cause
                and reports facts + a hypothesis; you make the fix as an edit and ask
                it to re-run. Hand it batched work ("run `scripts/verify.sh` and report
                what fails"), not one command at a time.
              - `legwork` (subagent_type: legwork) does bulk search/reading of the
                tree and fixtures.
            Code reaches the remote through exactly ONE path - `runner`'s git - and
            there is no second path, no matter how small the change: a one-line edit
            ships the same way a new source does. A subagent's many turns stay in
            its own context, never yours - which is the point of the split. Neither
            subagent decides methodology or authors edits; those stay with you. Keep
            your own turns low: use only Task (for runner/legwork) and TodoWrite, and
            batch any tool-schema lookups into one step.

            This run is non-interactive - no human is watching to approve a tool call.
            If a tool returns "requires approval" or "you haven't granted it", that is
            TERMINAL: the tool is simply not available to you. Do NOT retry it, do NOT
            wait or ask the user to approve it, and do NOT use /update-config or any
            skill to self-grant. Re-route the action through `runner` (for any command
            or git) and continue. Burning turns on an approval that will never arrive
            is the most expensive failure there is.

            Run every subagent Task SYNCHRONOUSLY: the harness backgrounds subagents by
            default, so every Task MUST set run_in_background: false, and you must NEVER
            end your turn while one is still running - a backgrounded subagent dies
            silently when the turn ends, and this one-shot job has no wakeup to resume it
            (ScheduleWakeup is disallowed for that reason). If you hand build/commit/push
            to `runner` and then end your turn to "wait", the process terminates with
            nothing pushed and the ship-guard fails the job. Only end your turn once
            `runner` has CONFIRMED the branch is pushed and the PR is open (or you opened
            a draft PR explaining the blocker).

            Baseline: CI on `main` (commit ${{ steps.main_ci.outputs.sha }}) was last
            ${{ steps.main_ci.outputs.conclusion }} (${{ steps.main_ci.outputs.url }}).
            Trust it: if a check fails after your change and isn't obviously related to
            what you touched, treat it as pre-existing and note it in the PR. Only
            re-verify against `main` (ask `runner` for one `git stash` / `git worktree`
            check, not a repeated stash/pop) if this baseline is unknown/stale or the
            failing check is in the exact area you changed.

            ${{ steps.orient.outputs.map }}

            The orientation map above is authoritative for repo structure and the build
            environment - trust it instead of re-listing directories or probing whether
            cairn.duckdb exists. The environment is already built; verify only what you
            change.

            ${{ steps.reference.outputs.ref }}

            The reference above is the authoritative template for this issue's layer -
            your change is a near-copy of it. Adapt only the source-specific parts. Do
            NOT re-read those exemplars, and do NOT read neighbouring layers' files that
            are out of scope. Every file you read rides in every later turn, so
            unnecessary reading is the single biggest cost driver.

            ${{ steps.scaffold.outputs.note }}

            ${{ steps.research_brief.outputs.brief }}

            ${{ steps.plan_brief.outputs.plan }}

            Implement issue
            #${{ github.event.issue.number || github.event.inputs.issue_number }},
            titled "${{ steps.issue.outputs.title }}". Its body is inlined between the
            <issue-body> tags below, fetched at the start of this run - do NOT spend a
            turn re-fetching it with get_issue (that tool is a fallback for the rare
            case the block below is empty because the fetch failed). Treat it as the
            authoritative spec - the no-LLM dispatcher (cairn-dispatch.yml) generates
            it from the BACKLOG.md candidate: it names the layer's sentinel artifact,
            the earlier/later layers, and quotes the candidate entry with its watch
            caveats verbatim. Execute it directly; investigate the codebase only where
            it is genuinely insufficient or ambiguous.

            <issue-body>
            ${{ steps.issue.outputs.body }}
            </issue-body>
            - `data-refresh`: follow the matching CLAUDE.md "Recurring maintenance"
              checklist exactly (idempotent ingest, new append-only snapshot, refresh CI
              fixtures, bump release dirs, re-check the assumptions the models lean on).
            - `feat`: implement ONLY the single layer this issue asks for, within the
              candidate's "watch" caveats - the issue's "Scope: this layer only"
              section is binding, and later layers get their own issues once this
              merges. New numbers go in a dbt mart (tested there); the site/export
              only read. Never invent figures - real source categories or explicit
              NULL + a note. A new source gets its own append-only manifest under
              sources/.
            Never weaken a test to make a change pass.

            BACKLOG.md upkeep (for a `feat` issue only - skip this for `data-refresh`):
            the no-LLM dispatcher decides "this layer is done" purely by the sentinel
            path in the candidate's `<!-- dispatch -->` block existing on main, and it
            quotes the entry verbatim into the NEXT layer's issue as soon as your PR
            merges - so keep both truthful in the SAME PR:
              - If you name the layer's artifact differently than the sentinel path the
                issue body states, update the candidate's `<!-- dispatch -->` block AND
                the matching *Layers* bullet in BACKLOG.md to the actual path -
                otherwise the dispatcher will consider the layer still missing and
                re-dispatch it after your PR merges.
              - Rewrite the shipped layer's *Layers* bullet into the one-line shipped
                record BACKLOG.md's "Entry format" section prescribes (this issue/PR +
                the pointers later layers still need). Change nothing else in the
                entry - no extra status prose; the sentinels track doneness and the
                weekly replenish keeps the rest tidy.
              - If this issue completes the candidate's LAST layer (every sentinel in
                its block now exists), instead move the whole entry from "Live
                candidates" to "Considered and rejected" in the style already there
                (`- **<name>.** Shipped: merged in this PR (<date>). <one sentence
                naming the artifact now live>.`) and renumber the remaining candidates.

            ${{ steps.ingestion_guidance.outputs.guidance }}

            Branch naming: `agent/<issue-number>-<short-slug>`. First check whether a
            previous run already made progress: list open PRs
            (mcp__github__list_pull_requests) and ask `runner` for remote branches
            (`git branch -r`) matching `agent/<issue-number>-*`. If one exists, have
            `runner` check it out and report its recent commits, then continue from
            there instead of starting over; otherwise have `runner` create a fresh
            branch. Commit each logical milestone as you finish it - ask `runner` to
            stage the files you wrote, commit with a conventional-commit message (one
            logical change per commit), and push - rather than saving everything for the
            end, so a run that hits the turn limit still leaves pushed progress the next
            run can resume.

            Before opening the PR, have `runner` run `scripts/verify.sh` - ONE batched
            task that runs the whole CI gate (ruff, sqlfluff, pytest, `dbt build`, the
            ESRS export, `build:strict`) in the correct order and returns a compact
            PASS/FAIL summary. It bakes in the export-before-`build:strict` ordering, so
            neither you nor `runner` has to sequence those (getting it wrong 404s the
            strict build and triggers a long, expensive loop). Ask for
            `scripts/verify.sh --fix` so deterministic formatting (ruff/sqlfluff) is
            auto-applied in place rather than bounced back to you as a failure to
            hand-fix. Act on the summary: fix any FAIL as an edit and have `runner`
            re-run. The environment is pre-built and the pristine tree already passes
            verify, so a re-run only covers what you changed. Open the PR only once
            `runner` reports verify green.

            Open ONE pull request against `main`, opening with a section headed
            "## Executive summary": 2-4 plain-language sentences for a reader with no
            Cairn context, spelling out each acronym or jargon term on first use (e.g.
            "EU ETS (the EU's Emissions Trading System)", "manifest (the append-only
            file that pins which source snapshot Cairn uses)"). Below it, keep the
            technical content: link the issue with a closing keyword ("Closes
            #<issue>" - the dispatcher's dedup relies on the issue auto-closing
            when the PR merges), summarise the change, state the
            data/methodology impact, and list any assumptions. Do NOT merge. If you
            cannot make CI pass within scope, open a DRAFT PR explaining exactly what
            blocks it rather than forcing it green.
        # BASH_MAX_OUTPUT_LENGTH (default 30,000 chars): hard-caps any single
        # Bash result regardless of whether the command was piped through
        # head/tail. This truncates at the harness level after the command's
        # exit code is already captured, so it can't corrupt a pass/fail
        # check the way rewriting commands with a shell pipe could.
        env:
          BASH_MAX_OUTPUT_LENGTH: "10000"

      # Guard against the "quiet false-green": claude-code-action reports success
      # even when the agent shipped nothing -- e.g. it hit a permission denial and
      # just explained it was blocked instead of routing through `runner`
      # (run 28469212788). Turn that into a loud failure: unless this run left a
      # pushed agent/<issue>-* branch OR an open PR for the issue, fail the job. A
      # draft PR (the sanctioned "I'm blocked" exit) satisfies it; silence does
      # not. Only runs when the action itself claimed success, so it doesn't pile
      # onto an already-failed run.
      - name: Require pushed branch or PR
        if: ${{ always() && steps.claude.outcome == 'success' }}
        uses: actions/github-script@v7
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number || github.event.inputs.issue_number }}
        with:
          github-token: ${{ github.token }}
          script: |
            const issue = process.env.ISSUE_NUMBER;
            const prefix = `agent/${issue}-`;
            const { owner, repo } = context.repo;
            const branches = await github.paginate(github.rest.repos.listBranches, {
              owner, repo, per_page: 100,
            });
            const hasBranch = branches.some((b) => b.name.startsWith(prefix));
            const prs = await github.paginate(github.rest.pulls.list, {
              owner, repo, state: 'all', per_page: 100,
            });
            const hasPr = prs.some((p) => p.head.ref.startsWith(prefix));
            if (hasBranch || hasPr) {
              core.info(`Shipped work for #${issue}: branch=${hasBranch} pr=${hasPr}`);
            } else {
              core.setFailed(
                `No agent/${issue}-* branch was pushed and no PR was opened: the ` +
                `run reported success but shipped nothing (a blocked/false-green ` +
                `run). Check the agent's final message in the job log.`
              );
            }

      # Cost visibility (best-effort; never fails the run). Parse every Claude
      # step's execution_file (research + plan + implement; a skipped step's
      # empty path is ignored by the script) into one merged markdown summary
      # + the total cost in USD.
      - name: Summarise run cost
        id: cost
        if: always()
        run: |
          python3 scripts/ai_cost_summary.py \
            --execution-file "${{ steps.claude.outputs.execution_file }}" \
            --execution-file "${{ steps.research.outputs.execution_file }}" \
            --execution-file "${{ steps.plan.outputs.execution_file }}" \
            --label "Cairn Implement" \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            -o "${{ runner.temp }}/ai_cost.md"

      # Attribute the cost to the PR this run opened (branch agent/<issue>-*),
      # falling back to the issue itself if no PR was created (e.g. a blocked run).
      - name: Attribute run cost
        if: always()
        uses: actions/github-script@v7
        env:
          RUN_START: ${{ steps.run_start.outputs.ts }}
          ISSUE_NUMBER: ${{ github.event.issue.number || github.event.inputs.issue_number }}
          COMMENT_PATH: ${{ runner.temp }}/ai_cost.md
          COST_USD: ${{ steps.cost.outputs.cost_usd }}
          PROJECTS_TOKEN: ${{ secrets.PROJECTS_TOKEN || secrets.CAIRN_BOT_TOKEN || github.token }}
          PROJECT_OWNER: ${{ vars.AI_COST_PROJECT_OWNER || 'fabiandemoel' }}
          PROJECT_NUMBER: ${{ vars.AI_COST_PROJECT_NUMBER || '1' }}
          FIELD_NAME: ${{ vars.AI_COST_FIELD_NAME || 'AI cost (USD)' }}
        with:
          # Comment via GITHUB_TOKEN: this workflow's `permissions:` grants it
          # issues + pull-requests: write, enough to comment on the PR or issue.
          # The Projects v2 calls use PROJECTS_TOKEN.
          github-token: ${{ github.token }}
          script: |
            const fs = require('fs');
            const path = require('path');
            const attribute = require(path.resolve('.github/scripts/attribute_run_cost.js'));

            const issue = parseInt(process.env.ISSUE_NUMBER, 10);
            const since = new Date(process.env.RUN_START);
            const prs = await github.rest.pulls.list({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'all', sort: 'created', direction: 'desc', per_page: 30,
            });
            const match = prs.data.filter(
              (p) => p.head.ref.startsWith(`agent/${issue}-`) && new Date(p.created_at) >= since,
            );
            const targets = match.length ? [match[0].number] : [issue];

            let commentBody = '';
            try { commentBody = fs.readFileSync(process.env.COMMENT_PATH, 'utf8'); } catch (e) {}

            await attribute({
              github, context, core, targets, commentBody,
              costUsd: process.env.COST_USD,
              projectOwner: process.env.PROJECT_OWNER,
              projectNumber: parseInt(process.env.PROJECT_NUMBER, 10),
              fieldName: process.env.FIELD_NAME,
              projectsToken: process.env.PROJECTS_TOKEN,
            });