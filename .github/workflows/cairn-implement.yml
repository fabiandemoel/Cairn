name: Cairn Implement

# Runs only when YOU label an issue `approved` (or via manual dispatch with an
# issue number). It implements that one issue on a branch and opens a PR against
# main. It does NOT merge. Your existing CI (lint, test, dbt-build, evidence-build,
# benchmark-diff) is the gate; you review the benchmark diff and merge.
#
# IMPORTANT â€” token: the PR must be opened with a PAT / GitHub-App token
# (secrets.CAIRN_BOT_TOKEN), NOT the default GITHUB_TOKEN. GitHub deliberately does
# not fire workflows for events created by GITHUB_TOKEN, so a PR opened with it
# would skip ci.yml and you'd lose the gate. Create a fine-grained PAT (contents +
# pull_requests: write) or use the app token from `/install-github-app`, and store
# it as CAIRN_BOT_TOKEN. Confirm the action's token input name against its README.

on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Issue number to implement"
        required: true

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read

concurrency:
  group: cairn-implement
  cancel-in-progress: false

jobs:
  implement:
    # Only the `approved` label triggers this; ignore every other label event.
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.label.name == 'approved'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.CAIRN_BOT_TOKEN }}

      # Toolchain available + cached so Claude's build/test commands are fast.
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: site/package-lock.json

      # data-refresh issues are a mechanical checklist (run the idempotent
      # ingest, confirm a new snapshot, refresh fixtures, run dbt/pytest) â€”
      # Haiku is sufficient and ~much cheaper. feat issues require design
      # judgement (new dbt models, mappings, site queries) and stay on
      # Sonnet. Falls back to Sonnet if the label can't be read.
      - name: Determine model based on issue labels
        id: model
        uses: actions/github-script@v7
        with:
          script: |
            const issueNumber = ${{ github.event.issue.number || github.event.inputs.issue_number }};
            let model = "claude-sonnet-4-6";
            let title = "";
            let labelsCsv = "";
            try {
              const { data: issue } = await github.rest.issues.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
              });
              const labels = issue.labels.map(l => (typeof l === "string" ? l : l.name));
              labelsCsv = labels.join(",");
              title = issue.title || "";
              model = labels.includes("data-refresh") ? "claude-haiku-4-5-20251001" : "claude-sonnet-4-6";
              core.info(`Issue #${issueNumber} labels: ${labelsCsv} -> model ${model}`);
            } catch (err) {
              core.warning(`Could not read labels for #${issueNumber}, defaulting to Sonnet: ${err}`);
            }
            // title/labels feed the per-layer reference generator below; on a
            // read failure they stay empty and the generator falls back to a
            // "find the closest example" note rather than crashing.
            core.setOutput("model", model);
            core.setOutput("title", title);
            core.setOutput("labels", labelsCsv);

      # Timestamp the run start so the cost step can find the PR this run opens
      # (branch agent/<issue>-*) without grabbing an older one.
      - name: Record run start
        id: run_start
        run: echo "ts=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      # No-LLM baseline: knowing upfront whether ci.yml is currently green on
      # main means the agent never needs to git-stash/checkout main itself to
      # tell "I broke this" apart from "this was already broken" — that
      # stash/pop round trip (done inline, mid-debugging) was itself a cost
      # driver on run 28267511721. A stale/unknown baseline just falls back to
      # the agent checking directly, so this is a pure cost optimization, not
      # a correctness dependency.
      - name: Check latest CI status on main
        id: main_ci
        uses: actions/github-script@v7
        with:
          script: |
            let conclusion = "unknown", sha = "unknown", url = "";
            try {
              const { data } = await github.rest.actions.listWorkflowRuns({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: "ci.yml",
                branch: "main",
                status: "completed",
                per_page: 1,
              });
              const run = data.workflow_runs[0];
              if (run) {
                conclusion = run.conclusion;
                sha = run.head_sha.substring(0, 7);
                url = run.html_url;
              }
            } catch (err) {
              core.warning(`Could not fetch main's CI status: ${err}`);
            }
            core.setOutput("conclusion", conclusion);
            core.setOutput("sha", sha);
            core.setOutput("url", url);

      # Pre-build the environment so the agent starts from a green, fully-built
      # tree instead of re-discovering and rebuilding it turn by turn. Mirrors
      # ci.yml's lint/test/dbt-build/evidence-build jobs. Run logs showed the
      # bulk of an implement run's turns went to re-deriving exactly this — does
      # cairn.duckdb exist? where? why does build:strict 404 on the export
      # download? what rebuilds the Evidence source layer? — all eliminated by
      # having it already done (warehouse at ./cairn.duckdb, ESRS export bundle
      # under site/static/downloads/esrs_e1/, site deps installed, source layer
      # built). continue-on-error: a failure here just falls back to the agent
      # building it itself, exactly as before — this is a pure cost
      # optimization, not a correctness gate.
      - name: Pre-build environment (deps, warehouse, ESRS export, site sources)
        continue-on-error: true
        run: |
          uv sync --locked --all-groups
          uv run dbt build --project-dir transform --profiles-dir transform
          uv run python scripts/export_esrs_e1.py --out-dir site/static/downloads/esrs_e1
          cd site && npm ci && npm run sources

      # Generate the repo-orientation map and capture it for the prompt. Uses
      # plain python3 (the script is stdlib-only) so it works even if the
      # pre-build step above failed. The map lists the stable facts every run
      # was re-discovering: the build sequence, the warehouse/Evidence wiring,
      # and the current layer inventory (which sources/models/site queries
      # exist). It is scanned from the tree each run, so it never goes stale.
      - name: Generate repo orientation map
        id: orient
        run: |
          {
            echo 'map<<ORIENT_EOF'
            python3 scripts/repo_orientation.py
            echo
            echo 'ORIENT_EOF'
          } >> "$GITHUB_OUTPUT"

      # No-LLM: inline the canonical exemplar(s) for THIS issue's layer so the
      # agent starts with the exact pattern to copy already in context, instead
      # of spending many turns reading (and re-reading) the reference files to
      # re-derive it — the dominant cost in run logs (run 28391012503 spent 42 of
      # 73 tool calls on recon before writing a line). The layer is inferred from
      # the issue title/labels; an unknown layer or a missing exemplar degrades
      # to a "find the closest example" note, so this is a pure cost
      # optimization, never a correctness gate. Scanned from the tree each run,
      # so the template never goes stale.
      - name: Generate canonical reference for the issue's layer
        id: reference
        env:
          ISSUE_TITLE: ${{ steps.model.outputs.title }}
          ISSUE_LABELS: ${{ steps.model.outputs.labels }}
        run: |
          {
            echo 'ref<<REF_EOF'
            python3 scripts/reference_for_layer.py --title "$ISSUE_TITLE" --labels "$ISSUE_LABELS"
            echo
            echo 'REF_EOF'
          } >> "$GITHUB_OUTPUT"

      - id: claude
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.CAIRN_BOT_TOKEN }}
          # show_full_output surfaces denied tool calls in the job log.
          #
          # --allowedTools is required: claude-code-action ships no default
          # allowlist, so with none set every tool call is denied and the run
          # still reports success â€” a quiet false-green where the agent just
          # explains it's blocked (run 28079588272).
          #
          # ORCHESTRATOR/EXECUTOR SPLIT. Bash, WebFetch and WebSearch are
          # deliberately ABSENT here: this Claude is the *orchestrator*. It reads
          # the spec, authors file edits (Read/Write/Edit), and decides â€” but it
          # cannot run a shell command or fetch a URL itself. All command
          # execution (uv/dbt/npm/ruff/sqlfluff/pytest + git stage/commit/push)
          # is delegated via Task to the `runner` subagent, and all bulk
          # search / live-source discovery to the `legwork` subagent â€” each runs
          # in its OWN conversation (.claude/agents/{runner,legwork}.md, both
          # pinned to Haiku). The point is context isolation: a 30-turn
          # build/test/debug loop inside a subagent collapses to one summary in
          # the orchestrator's context instead of riding in every later turn.
          # Run 28447652743 spent $5.67 / 82 turns with 6.86M cache-read tokens,
          # almost entirely an inline debug loop re-sent each turn; this split
          # moves that loop out of the expensive orchestrator context. Removing
          # Bash is what *enforces* the split â€” a prompt asking nicely does not
          # (the agent kept debugging inline despite being told to delegate).
          # mcp__github__get_issue / mcp__github__create_pull_request are the
          # bundled github-mcp-server's actual tool names (run 28085542460);
          # guessing wrong (issue_read, issue_write) silently denies them.
          #
          # --max-turns 100: a full new-source slice (ingestion + mart + test
          # + site) needs room; 20 then 60 both hit error_max_turns mid-work
          # (runs 28085542460, 28173119243). --model sets the ORCHESTRATOR model:
          # the model step above runs it as Sonnet for feat issues (design
          # judgement) and drops to Haiku for data-refresh (a fixed checklist).
          # The runner and legwork subagents are pinned to Haiku regardless.
          show_full_output: true
          claude_args: >-
            --max-turns 100
            --model ${{ steps.model.outputs.model }}
            --allowedTools "Read,Write,Edit,Glob,Grep,TodoWrite,Task,mcp__github__get_issue,mcp__github__create_pull_request,mcp__github__list_pull_requests"
          prompt: |
            CLAUDE.md and BACKLOG.md are authoritative and override anything in this
            prompt, but they are long â€” read them narrowly, not cover to cover, since
            every turn re-sends the whole conversation so far and a big upfront read
            inflates every later turn's cost. Read CLAUDE.md's "Non-negotiable
            invariants" section in full (short, always applies). Then grep CLAUDE.md
            and BACKLOG.md for the specific issue/candidate at hand and read only the
            matching section: for a `data-refresh` issue, just its "Recurring
            maintenance" checklist; for a `feat` issue, just its BACKLOG.md candidate
            entry. Consult "Gotchas" or other sections only if you hit something they
            plausibly cover.

            EXECUTION MODEL — read this first. You are the ORCHESTRATOR. You have
            NO shell access and cannot fetch URLs: you read files, author edits
            (Write/Edit), and make every decision yourself, but every *action* runs
            in a separate subagent conversation via the Task tool:
              - `runner` (subagent_type: runner) executes ALL shell commands — the
                build/verify sequence (ruff, sqlfluff, pytest, `dbt build`, the ESRS
                export, `npm run build:strict`) and every git operation (stage the
                files you wrote, commit with your message, push the branch). On a
                failing command it iterates IN ITS OWN context to find the root
                cause and reports back facts + a hypothesis; you then make the fix
                as a file edit and ask it to re-run. Hand it batched work ("run the
                full verify sequence and report what fails"), not one command at a
                time.
              - `legwork` (subagent_type: legwork) does bulk search/reading and all
                live-source discovery.
            Why: each subagent runs in its own conversation, so its many turns of
            command output and debugging are discarded and never ride in your later
            turns. That re-sent context is the dominant cost (the last run spent
            most of $5.67 / 82 turns on exactly this inline loop), so keeping
            execution out of your context is the whole point. There is no Bash tool
            to fall back on — do NOT try to work around its absence; route every
            command through `runner`. Neither subagent decides mappings, model
            design, or methodology, and neither authors file edits (apart from
            `runner` running git on files you already wrote); those stay with you.

            Baseline: CI on `main` (commit ${{ steps.main_ci.outputs.sha }})
            was last ${{ steps.main_ci.outputs.conclusion }}
            (${{ steps.main_ci.outputs.url }}). Trust this by default: if a
            check fails after your change and it isn't obviously related to
            what you touched, treat it as pre-existing and note it in the PR
            rather than re-verifying against `main` yourself. Only verify
            against `main` (ask `runner` for one `git stash` / `git worktree`
            check, not a repeated stash/pop while you try fixes) if this baseline
            is `unknown`/stale or the failing check is in the exact area you
            changed.

            ${{ steps.orient.outputs.map }}

            The orientation map above is authoritative for repo structure and the
            build environment — trust it instead of re-listing directories,
            re-reading connection.yaml, or probing whether cairn.duckdb exists.
            The environment is already built, so verify only what you change.

            ${{ steps.reference.outputs.ref }}

            The reference above is the authoritative template for this issue's
            layer — your change is a near-copy of it. Adapt only the
            source-specific parts. Do NOT re-read those exemplar files, and do
            NOT read neighbouring layers' files that are out of scope for this
            issue (e.g. for an ingestion issue, don't open the staging models or
            marts). Every file you read rides in every later turn's context, so
            unnecessary reading is the single biggest driver of this run's cost.

            Treat the ISSUE BODY as the authoritative spec. cairn-scout already
            writes it with the exact files to touch, the fixture requirements,
            and the watch caveats — execute that spec directly rather than
            re-deriving a plan it already gives you. Investigate the codebase
            only where the spec is genuinely insufficient or ambiguous.

            For a NEW data source, do all live-source discovery in ONE legwork
            task up front (Task tool, subagent_type: legwork): hand it the source
            URL and ask it to return the column layout, the release-token field,
            the relevant aggregate/code values, and a handful of representative
            fixture rows. Do NOT curl or probe the source from your own turns —
            that output then rides in every later turn's context. Do NOT run the
            real `--offline` ingest as a check either: it downloads the full
            dataset and writes a machine-specific `file://` snapshot into the
            manifest that you then have to detect and reset (pure wasted turns).
            Rely on the unit test against the committed fixture; the manifest
            ships `snapshots: []`.

            Keep your own turn count low. Do NOT use the background-task or
            agent-messaging tools (TaskCreate / TaskUpdate / SendMessage) for
            this single-layer issue — they add round trips without value. Use
            TodoWrite if you want a checklist, and use the Task tool only for the
            `runner` and `legwork` subagents described above. If you must look up
            tool schemas, batch the lookups into one step.

            Implement issue
            #${{ github.event.issue.number || github.event.inputs.issue_number }}.

            - If it is a `data-refresh` issue, follow the matching CLAUDE.md
              "Recurring maintenance" checklist exactly (idempotent ingest, new
              append-only snapshot, refresh CI fixtures, bump release dirs, re-check
              the assumptions the models lean on). Never weaken a test to pass.
            - If it is a `feat` issue, implement the corresponding BACKLOG.md
              candidate within its stated scope and "watch" caveats. New numbers go
              in a dbt mart (tested there); the site/export only read. Never invent
              figures â€” real source categories or explicit NULL + a note. New source
              => its own append-only manifest under sources/.

            Branch naming: `agent/<issue-number>-<short-slug>`, e.g. `agent/38-eurostat-ingestion`
            â€” the issue number makes a previous run's branch unambiguous to find.

            Before starting, check whether a previous run already made progress on
            this issue: list open PRs yourself (`mcp__github__list_pull_requests`)
            and ask `runner` for remote branches (`git branch -r`) matching
            `agent/<issue-number>-*`. If one exists, have `runner` check it out and
            report its recent commits, then continue from there instead of starting
            over â€” so you don't redo or contradict finished work. Otherwise, have
            `runner` create a fresh branch named `agent/<issue-number>-<short-slug>`.

            Commit after each logical milestone as you finish it rather than saving
            everything for one commit at the end: once you have written the files for
            a milestone, ask `runner` to stage them, commit with a conventional-commit
            message (one logical change per commit), and push. A run that hits the
            turn limit mid-task should still leave committed, pushed progress on its
            branch so the next run can resume it instead of losing it when the job's
            runner is torn down.

            Before opening the PR, have `runner` run and pass what CI runs, in the
            exact order given by the orientation map's "Build & verify sequence"
            above (it mirrors ci.yml) — give it that as one batched task and act on
            the pass/fail summary it returns. Mind the export step in that sequence:
            it writes the ESRS E1 bundle into site/static/downloads/esrs_e1/, which
            the disclosure page links to, so running build:strict before it (or
            after changing the export without re-running it) makes the strict build
            fail on a 404 and triggers a long, expensive trial-and-error loop. The
            environment was pre-built for this run, so in practice `runner` only
            needs to re-run the steps downstream of what you changed. Open the PR
            only once `runner` reports the sequence green.

            Open ONE pull request against `main`. The description must open with a
            section headed "## Executive summary": 2-4 plain-language sentences for a
            reader with no Cairn context, explaining what changed and why it matters.
            Spell out every acronym or piece of internal jargon the first time it
            appears there (e.g. "CBS (Statistics Netherlands)", "EU ETS (the EU's
            Emissions Trading System)", "NACE (the EU's industry classification)",
            "manifest (the append-only file that pins which source snapshot Cairn
            uses)"). Below that section, keep the existing technical content: link the
            issue, summarise the change, state the data/methodology impact, and list
            any assumption you made. Do NOT merge. If you cannot make CI pass within
            scope, open a draft PR explaining exactly what blocks it instead of
            forcing it green.
        # BASH_MAX_OUTPUT_LENGTH (default 30,000 chars): hard-caps any single
        # Bash result regardless of whether the command was piped through
        # head/tail. This truncates at the harness level after the command's
        # exit code is already captured, so it can't corrupt a pass/fail
        # check the way rewriting commands with a shell pipe could.
        env:
          BASH_MAX_OUTPUT_LENGTH: "10000"

      # Cost visibility (best-effort; never fails the run). Parse the action's
      # execution_file into a markdown summary + the total cost in USD.
      - name: Summarise run cost
        id: cost
        if: always()
        run: |
          python3 scripts/ai_cost_summary.py \
            --execution-file "${{ steps.claude.outputs.execution_file }}" \
            --label "Cairn Implement" \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            -o "${{ runner.temp }}/ai_cost.md"

      # Attribute the cost to the PR this run opened (branch agent/<issue>-*),
      # falling back to the issue itself if no PR was created (e.g. a blocked run).
      - name: Attribute run cost
        if: always()
        uses: actions/github-script@v7
        env:
          RUN_START: ${{ steps.run_start.outputs.ts }}
          ISSUE_NUMBER: ${{ github.event.issue.number || github.event.inputs.issue_number }}
          COMMENT_PATH: ${{ runner.temp }}/ai_cost.md
          COST_USD: ${{ steps.cost.outputs.cost_usd }}
          PROJECTS_TOKEN: ${{ secrets.PROJECTS_TOKEN || secrets.CAIRN_BOT_TOKEN || github.token }}
          PROJECT_OWNER: ${{ vars.AI_COST_PROJECT_OWNER || 'fabiandemoel' }}
          PROJECT_NUMBER: ${{ vars.AI_COST_PROJECT_NUMBER || '1' }}
          FIELD_NAME: ${{ vars.AI_COST_FIELD_NAME || 'AI cost (USD)' }}
        with:
          # Comment via GITHUB_TOKEN: this workflow's `permissions:` grants it
          # issues + pull-requests: write, enough to comment on the PR or issue.
          # The Projects v2 calls use PROJECTS_TOKEN.
          github-token: ${{ github.token }}
          script: |
            const fs = require('fs');
            const path = require('path');
            const attribute = require(path.resolve('.github/scripts/attribute_run_cost.js'));

            const issue = parseInt(process.env.ISSUE_NUMBER, 10);
            const since = new Date(process.env.RUN_START);
            const prs = await github.rest.pulls.list({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'all', sort: 'created', direction: 'desc', per_page: 30,
            });
            const match = prs.data.filter(
              (p) => p.head.ref.startsWith(`agent/${issue}-`) && new Date(p.created_at) >= since,
            );
            const targets = match.length ? [match[0].number] : [issue];

            let commentBody = '';
            try { commentBody = fs.readFileSync(process.env.COMMENT_PATH, 'utf8'); } catch (e) {}

            await attribute({
              github, context, core, targets, commentBody,
              costUsd: process.env.COST_USD,
              projectOwner: process.env.PROJECT_OWNER,
              projectNumber: parseInt(process.env.PROJECT_NUMBER, 10),
              fieldName: process.env.FIELD_NAME,
              projectsToken: process.env.PROJECTS_TOKEN,
            });