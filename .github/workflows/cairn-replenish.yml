name: Cairn Replenish

# Weekly backlog curator. Proposes new candidates, re-scores existing ones, and
# retires dead/off-spine ideas to "Considered and rejected" â€” as a docs-only PR
# touching ONLY BACKLOG.md. You merge it; your merge is the curation step (a menu
# a bot can silently rewrite is no longer curated). Uses CAIRN_BOT_TOKEN so the PR
# triggers CI under branch protection; ci.yml is wasteful on a docs-only change but
# harmless â€” add a paths-ignore filter to ci.yml if you want to skip it.

on:
  schedule:
    - cron: "42 6 * * 4"   # Thursday 06:42 UTC (clear of the Mon reproducibility cron)
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write
  issues: read

concurrency:
  group: cairn-replenish
  cancel-in-progress: true

env:
  # See cairn-implement.yml for the full rationale. AI_COST_PROJECT_NUMBER is
  # the small integer in the project's URL, not its GraphQL node ID.
  AI_COST_PROJECT_OWNER: ${{ github.repository_owner }}
  AI_COST_PROJECT_NUMBER: 1
  AI_COST_PROJECT_FIELD_NAME: "AI cost (USD)"

jobs:
  replenish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.CAIRN_BOT_TOKEN }}

      - uses: anthropics/claude-code-action@v1
        id: claude
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.CAIRN_BOT_TOKEN }}
          # show_full_output surfaces denied tool calls in the job log.
          #
          # --allowedTools is required: with none set claude-code-action
          # denies every tool call yet still reports success â€” it drafts the
          # whole replenish in its final text and gives up (run 28080248083).
          # Bash is unrestricted because git branch/commit/push runs through
          # shell control flow that prefix matching can't see.
          # mcp__github__create_pull_request is the bundled github-mcp-server's
          # actual tool name. --model Sonnet: re-scoring one markdown file
          # against an explicit rubric needs no Opus-level judgement.
          show_full_output: true
          claude_args: >-
            --max-turns 20
            --model claude-sonnet-4-6
            --allowedTools "Read,Write,Edit,Glob,Grep,TodoWrite,Bash,WebFetch,mcp__github__list_issues,mcp__github__list_pull_requests,mcp__github__search_pull_requests,mcp__github__create_pull_request"
          prompt: |
            You are Cairn's backlog curator. Read CLAUDE.md, all of BACKLOG.md
            (including "Considered and rejected"), and the open + recently closed
            issues and PRs. Edit ONLY BACKLOG.md. Do not touch any other file.

            Then, as a docs-only change:
            - Propose at most 3 NEW candidates that pass every "Rules of the game"
              admission test. Score each (Value / Effort / Spine-fit) with the same
              rubric, add the "watch" caveats and the repo paths it would touch.
            - Re-rank "Live candidates" by value, then spine-fit, then inverse effort.
            - Move any candidate that has shipped, been rejected in review, or
              drifted off-spine into "Considered and rejected" WITH the reason.
            - Do NOT re-propose anything already in "Considered and rejected".
            - Keep at most ~15 live candidates.

            Open ONE pull request against `main` from branch
            `replenish/<YYYY-MM-DD>`, titled "chore(backlog): weekly replenish".
            The description must open with a section headed "## Executive summary":
            2-4 plain-language sentences for a reader with no Cairn context, stating
            what the backlog reshuffle does and why. Spell out any acronym or jargon
            the first time it appears there. Below that section, summarise what you
            added, re-scored, and retired, and why, as today. Do NOT merge. If
            nothing meaningfully changed, say so and open no PR.

      # Cost/usage visibility (CLAUDE.md "Action usage & cost dashboard"):
      # see cairn-implement.yml for the full rationale. always() because cost
      # is incurred whether or not the run finished cleanly.
      - name: Record action usage
        id: usage
        if: always() && steps.claude.outputs.execution_file != ''
        run: |
          uv run python scripts/record_action_usage.py \
            --execution-file "${{ steps.claude.outputs.execution_file }}" \
            --workflow cairn-replenish \
            --summary-file "$GITHUB_STEP_SUMMARY" \
            --github-output "$GITHUB_OUTPUT"

      # replenish doesn't always open a PR (a no-op week says so and opens
      # none) -- this only finds one if branch_name was actually set.
      - name: Resolve PR opened by this run
        id: pr
        if: always() && steps.claude.outputs.branch_name != ''
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.CAIRN_BOT_TOKEN }}
          script: |
            const { data: prs } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              head: `${context.repo.owner}:${{ steps.claude.outputs.branch_name }}`,
              state: "open",
            });
            if (prs.length > 0) {
              core.setOutput("node_id", prs[0].node_id);
              core.setOutput("number", prs[0].number);
            }

      - name: Comment usage on PR
        if: always() && steps.usage.outputs.total_cost_usd != '' && steps.pr.outputs.number != ''
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.CAIRN_BOT_TOKEN }}
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number("${{ steps.pr.outputs.number }}"),
              body: [
                "**Claude action usage** (cairn-replenish, run " +
                  `[#${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})):`,
                `- model: \`${{ steps.usage.outputs.model }}\``,
                `- tokens: ${{ steps.usage.outputs.input_tokens }} in / ${{ steps.usage.outputs.output_tokens }} out`,
                `- cost: $${{ steps.usage.outputs.total_cost_usd }}`,
                `- turns: ${{ steps.usage.outputs.num_turns }}, duration: ${{ steps.usage.outputs.duration_ms }} ms`,
              ].join("\n"),
            });

      - name: Set AI cost project field
        if: always() && steps.usage.outputs.total_cost_usd != '' && steps.pr.outputs.node_id != ''
        uses: actions/github-script@v7
        env:
          PROJECT_OWNER: ${{ env.AI_COST_PROJECT_OWNER }}
          PROJECT_NUMBER: ${{ env.AI_COST_PROJECT_NUMBER }}
          PROJECT_FIELD_NAME: ${{ env.AI_COST_PROJECT_FIELD_NAME }}
          CONTENT_NODE_IDS: ${{ steps.pr.outputs.node_id }}
          COST_USD: ${{ steps.usage.outputs.total_cost_usd }}
        with:
          github-token: ${{ secrets.CAIRN_BOT_TOKEN }}
          script-path: .github/scripts/set_project_cost_field.mjs