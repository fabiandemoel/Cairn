name: Cairn Replenish

# Weekly backlog curator. Proposes new candidates, re-scores existing ones, and
# retires dead/off-spine ideas to "Considered and rejected" â€” as a docs-only PR
# touching ONLY BACKLOG.md. You merge it; your merge is the curation step (a menu
# a bot can silently rewrite is no longer curated). Uses CAIRN_BOT_TOKEN so the PR
# triggers CI under branch protection; ci.yml is wasteful on a docs-only change but
# harmless â€” add a paths-ignore filter to ci.yml if you want to skip it.

on:
  schedule:
    - cron: "42 6 * * 4"   # Thursday 06:42 UTC (clear of the Mon reproducibility cron)
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write
  issues: read

concurrency:
  group: cairn-replenish
  cancel-in-progress: true

jobs:
  replenish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.CAIRN_BOT_TOKEN }}

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.CAIRN_BOT_TOKEN }}
          # show_full_output prints the full SDK conversation (including which
          # tool calls get denied) so a failure's cause is visible in the job
          # log directly, without a separate debugging pass.
          #
          # --allowedTools is required: with none set, claude-code-action
          # denies every tool call by default (no Edit/Write to BACKLOG.md,
          # no git, no PR tool) and the run still finishes with
          # conclusion: success â€” it drafts the whole replenish in its final
          # text and gives up, reporting it's blocked. Confirmed on run
          # 28080248083 ("the harness is blocking writes to BACKLOG.md...
          # the edit, branch creation, and PR open all require a permission
          # grant I don't have here"). Bash is unrestricted for the same
          # reason as cairn-scout/cairn-implement: git branch/commit/push
          # can't be enumerated as literal prefixes. mcp__github__create_pull_request
          # is the real tool name exposed by the bundled github-mcp-server.
          # --model: this job re-scores/curates one markdown file against an
          # explicit rubric, not a task needing Opus-level judgement â€”
          # Sonnet is enough and cheaper. cairn-implement also runs on
          # Sonnet now (see its own comment); each issue cairn-scout files
          # is scoped to a single repo layer, so an implement run is a
          # bounded, Sonnet-sized task.
          show_full_output: true
          claude_args: >-
            --max-turns 20
            --model claude-sonnet-4-6
            --allowedTools "Read,Write,Edit,Glob,Grep,TodoWrite,Bash,WebFetch,mcp__github__list_issues,mcp__github__list_pull_requests,mcp__github__search_pull_requests,mcp__github__create_pull_request"
          prompt: |
            You are Cairn's backlog curator. Read CLAUDE.md, all of BACKLOG.md
            (including "Considered and rejected"), and the open + recently closed
            issues and PRs. Edit ONLY BACKLOG.md. Do not touch any other file.

            Then, as a docs-only change:
            - Propose at most 3 NEW candidates that pass every "Rules of the game"
              admission test. Score each (Value / Effort / Spine-fit) with the same
              rubric, add the "watch" caveats and the repo paths it would touch.
            - Re-rank "Live candidates" by value, then spine-fit, then inverse effort.
            - Move any candidate that has shipped, been rejected in review, or
              drifted off-spine into "Considered and rejected" WITH the reason.
            - Do NOT re-propose anything already in "Considered and rejected".
            - Keep at most ~15 live candidates.

            Open ONE pull request against `main` from branch
            `replenish/<YYYY-MM-DD>`, titled "chore(backlog): weekly replenish".
            The description must open with a section headed "## Executive summary":
            2-4 plain-language sentences for a reader with no Cairn context, stating
            what the backlog reshuffle does and why. Spell out any acronym or jargon
            the first time it appears there. Below that section, summarise what you
            added, re-scored, and retired, and why, as today. Do NOT merge. If
            nothing meaningfully changed, say so and open no PR.