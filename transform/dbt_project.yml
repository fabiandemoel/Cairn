name: cairn
version: "1.1.0"
config-version: 2

profile: cairn

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

require-dbt-version: ">=1.8.0"

# *_raw_dir vars point at the directory holding a snapshot's parquet files for
# each source. Defaults are the committed CI fixtures; override with
# `--vars '{euets_raw_dir: <path>}'` etc. to build against a downloaded R2
# snapshot. Paths are resolved by DuckDB relative to the process CWD (repo root).
vars:
  raw_dir: "tests/fixtures/85669NED/2026-03-11"
  euets_raw_dir: "tests/fixtures/euets/2024-10"
  eea_raw_dir: "tests/fixtures/eea/2005-2025_v01_r00"
  eurostat_aea_raw_dir: "tests/fixtures/eurostat/env_ac_ainah_r2/2024-10-23"
  eurostat_gge_raw_dir: "tests/fixtures/eurostat_gge/2026-06-02"
  eua_raw_dir: "tests/fixtures/eua/2012-2025"
  emissieregistratie_crf_summary1_raw_dir: "tests/fixtures/emissieregistratie/crf_summary1/2026-V1.0"
  cbs_namea_air_emissions_raw_dir: "tests/fixtures/cbs_namea/air_emissions/2025-11-13"

models:
  cairn:
    staging:
      +materialized: view
    marts:
      +materialized: table

seeds:
  cairn:
    sector_mapping_cbs:
      +column_types:
        aggregate: boolean
    lei_mapping_euets:
      +column_types:
        lei: varchar
        gleif_legal_name: varchar
    carbon_leakage_list:
      +column_types:
        code: varchar
        oj_point: varchar
