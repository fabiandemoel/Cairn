version: 2

seeds:
  - name: sector_mapping_cbs
    description: >
      Maps each CBS 85669NED climate-sector category to a NACE Rev.2 section.
      All 52 source categories are listed. `aggregate = true` marks CBS
      totals/subtotals and IPCC bunker memo items, which are excluded from the
      mart's sector sum to avoid double counting. Leaf categories that cannot be
      attributed to a single NACE section have a NULL nace_section and a note.
    columns:
      - name: cbs_category_code
        description: CBS climate-sector code (primary key).
        tests:
          - unique
          - not_null
      - name: aggregate
        description: True for CBS totals/subtotals and bunker memo items.
        tests:
          - not_null

  - name: lei_mapping_euets
    description: >
      Reviewed mapping of euets.info (EUTL) installations to their operating
      legal entity's GLEIF Legal Entity Identifier (LEI, ISO 17442). This is a
      methodology seed, like sector_mapping_cbs: every change goes through a PR
      so benchmark-diff makes the impact visible. An LEI is only set where the
      GLEIF legalName matches the EUTL operator name (NL jurisdiction); where no
      confident match exists the lei stays NULL with a note -- LEIs are never
      invented. Coverage grows over time via reviewed PRs; installations absent
      from this seed surface a NULL LEI downstream (left join, never dropped).
    columns:
      - name: euets_installation_id
        description: EUTL installation identifier (primary key, e.g. NL_100).
        tests:
          - unique
          - not_null
          - relationships:
              to: ref('stg_euets__installations')
              field: installation_id
      - name: lei
        description: >
          GLEIF Legal Entity Identifier (20-char ISO 17442) of the operating
          legal entity, or NULL when no confident GLEIF match exists.

  - name: carbon_leakage_list
    description: >
      Reviewed transcription of the sectors and sub-sectors deemed exposed to
      a significant risk of carbon leakage for EU ETS Phase 4 (2021-2030) under
      Commission Delegated Regulation (EU) 2019/708 (OJ L 120, 11.5.2019).
      Annex I lists whole NACE Rev.2 sectors (code_type = 'nace'); Annex II
      lists PRODCOM sub-sectors within a broader NACE sector (code_type =
      'prodcom'). Like sector_mapping_cbs, every row is transcribed verbatim
      from the Regulation's annexes in a reviewed PR -- never paraphrased,
      inferred, or reconstructed from memory. This seed ships empty
      (header only) until a PR adds verified rows sourced directly from the
      Official Journal text; benchmark_installation_emissions joins it as a
      left join, so an empty seed leaves every installation's exposure flag
      false rather than blocking the mart.
    columns:
      - name: code
        description: >
          NACE Rev.2 code (code_type = 'nace') or PRODCOM code (code_type =
          'prodcom'), transcribed verbatim from the annex (primary key).
        tests:
          - unique
          - not_null
      - name: code_type
        description: Which classification `code` uses.
        tests:
          - not_null
          - accepted_values:
              values: ["nace", "prodcom"]
      - name: oj_annex
        description: Which annex of the Regulation the row is transcribed from.
        tests:
          - not_null
          - accepted_values:
              values: ["I", "II"]
      - name: sector_description
        description: Sector or sub-sector description, transcribed verbatim from the annex.
        tests:
          - not_null
      - name: oj_citation
        description: >
          Citation for the row (Regulation, annex, Official Journal reference).
        tests:
          - not_null
