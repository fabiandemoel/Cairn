version: 2

models:
  - name: stg_cbs__emissions
    description: >
      Typed, decoded 1:1 view of the raw CBS 85669NED observations
      (greenhouse-gas emissions per climate sector, IPCC, annual). Dimension
      codes are decoded to labels; one row per (category, gas, period).
    columns:
      - name: observation_key
        description: Surrogate natural key (category|gas|period).
        tests:
          - unique
          - not_null
      - name: cbs_category_code
        description: CBS climate-sector code.
        tests:
          - not_null
          - relationships:
              to: ref('sector_mapping_cbs')
              field: cbs_category_code
      - name: gas_code
        description: CBS emission-to-air (gas) code.
        tests:
          - not_null
      - name: period_code
        description: CBS period code (e.g. 1990JJ00).
        tests:
          - not_null
      - name: year
        description: Calendar year parsed from the period label.
        tests:
          - not_null

  - name: stg_euets__installations
    description: >
      Typed, decoded 1:1 view of the euets.info (EUTL) installations. The NACE
      section letter is resolved by walking the NACE hierarchy to level 1; ETS
      activity and country are decoded to labels. One row per installation, all
      countries -- the NL filter and the stationary/aircraft/maritime split are
      applied in the mart.
    columns:
      - name: installation_id
        description: EUTL installation identifier (e.g. NL_200580).
        tests:
          - unique
          - not_null
      - name: nace_section
        description: NACE Rev.2 section letter (A-U), NULL when the installation has no NACE code.
      - name: is_aircraft_operator
        description: >
          True for aircraft operators (excluded from the stationary benchmark).
          Nullable: a handful of source installations carry no flag, and the
          mart treats a NULL as not-confirmed-stationary, so it is excluded.
      - name: is_maritime_operator
        description: >
          True for maritime operators (excluded from the stationary benchmark).
          Nullable, handled like is_aircraft_operator.

  - name: stg_euets__compliance
    description: >
      Typed 1:1 view of the euets.info compliance table: verified emissions and
      allocation/surrender per installation per year. One row per
      (installation, year); future phase years carry NULL verified emissions.
    columns:
      - name: compliance_key
        description: Surrogate natural key (installation_id|year).
        tests:
          - unique
          - not_null
      - name: installation_id
        description: EUTL installation identifier.
        tests:
          - not_null
          - relationships:
              to: ref('stg_euets__installations')
              field: installation_id
      - name: year
        description: Compliance year.
        tests:
          - not_null

  - name: stg_eurostat__aea
    description: >
      Typed 1:1 view of the raw Eurostat AEA (Air Emissions Accounts) snapshot
      (env_ac_ainah_r2): greenhouse-gas and air-pollutant emissions per country,
      NACE section and year. Columns are renamed and typed; no rows are filtered.
      Uses the residence principle (see accounting note in the model file).
    columns:
      - name: observation_key
        description: Surrogate natural key (country|nace_r2|airpol|unit|year).
        tests:
          - unique
          - not_null
      - name: country
        description: ISO 3166-1 alpha-2 country code (e.g. NL, DE, FR), plus EU27_2020.
        tests:
          - not_null
      - name: nace_r2
        description: >
          NACE Rev.2 section or division code, or a Eurostat aggregate (e.g. TOTAL
          for the national sum, HH for households, G-U_X_H for services excluding
          transport). The full set actually present in env_ac_ainah_r2, confirmed
          against the live source (not just NACE section letters).
        tests:
          - not_null
          - accepted_values:
              values:
                ["A", "A01", "A02", "A03", "B", "C", "C10-C12", "C13-C15", "C16",
                 "C17", "C18", "C19", "C20", "C21", "C22", "C23", "C24", "C25",
                 "C26", "C27", "C28", "C29", "C30", "C31_C32", "C33", "D", "E",
                 "E36", "E37-E39", "F", "G", "G-U_X_H", "G45", "G46", "G47", "H",
                 "H49", "H50", "H51", "H52", "H53", "HH", "HH_HEAT", "HH_OTH",
                 "HH_TRA", "I", "J", "J58", "J59_J60", "J61", "J62_J63", "K",
                 "K64", "K65", "K66", "L", "L68A", "M", "M69_M70", "M71", "M72",
                 "M73", "M74_M75", "N", "N77", "N78", "N79", "N80-N82", "O", "P",
                 "Q", "Q86", "Q87_Q88", "R", "R90-R92", "R93", "S", "S94", "S95",
                 "S96", "T", "TOTAL", "TOTAL_HH", "U"]
      - name: airpol
        description: >
          Air pollutant code. The full set actually present in env_ac_ainah_r2
          (greenhouse gases, CO2-equivalent conversions, and other air pollutants),
          confirmed against the live source -- not just the four headline GHGs.
        tests:
          - not_null
          - accepted_values:
              values:
                ["ACG", "CH4", "CH4_CO2E", "CH4_NMVOCE", "CO", "CO2", "CO2_BIO",
                 "CO_NMVOCE", "GHG", "HFC_CO2E", "N2O", "N2O_CO2E", "NF3_SF6_CO2E",
                 "NH3", "NH3_SO2E", "NMVOC", "NOX", "NOX_NMVOCE", "NOX_SO2E",
                 "O3PR", "PFC_CO2E", "PM10", "PM2_5", "SOX_SO2E"]
      - name: unit
        description: >
          Unit of measurement. env_ac_ainah_r2 reports each observation in up to
          five units: THS_T (thousands of tonnes, the headline unit used for
          benchmarking), T (tonnes), G_HAB / KG_HAB (per-capita), and I15 (index,
          2015=100). Downstream consumers must filter to one unit -- comparing
          across units double-counts/conflates incompatible scales.
        tests:
          - not_null
          - accepted_values:
              values: ["G_HAB", "I15", "KG_HAB", "T", "THS_T"]
      - name: year
        description: Reporting year, cast from the source TIME_PERIOD string.
        tests:
          - not_null
      - name: value_ths_t_co2eq
        description: >
          Emission value in thousands of tonnes CO2-equivalent. Nullable -- a
          few source cells carry no observation; NULL is left as NULL, never a
          placeholder zero.
      - name: obs_flag
        description: Eurostat quality/observation flag. Nullable -- most cells are unflagged.

  - name: stg_eurostat__gge
    description: >
      Typed 1:1 view of the raw Eurostat env_air_gge snapshot: national greenhouse-gas
      totals and CRF-sector breakdowns for all EU27 member states plus Norway, Iceland,
      and the UK, drawn from UNFCCC national inventory reports. All countries, CRF sectors,
      pollutants, and years are kept; filtering to national totals (src_crf = 'TOTXMEMO',
      airpol = 'GHG', unit = 'MIO_T') is applied downstream. Uses the territorial
      principle -- the same accounting base as CBS 85669NED and the EU ETS, so NL
      national totals are a direct cross-check of the CBS figure (see
      assert_gge_nl_total_within_cbs).
    columns:
      - name: observation_key
        description: Surrogate natural key (country|src_crf|airpol|unit|year).
        tests:
          - unique
          - not_null
      - name: country
        description: ISO 3166-1 alpha-2 country code (e.g. NL, DE, FR).
        tests:
          - not_null
      - name: src_crf
        description: >
          IPCC Common Reporting Format sector code. 'TOTXMEMO' = national total
          excluding international aviation and shipping (memo items); CRF1-CRF5 are
          the sector breakdowns. CRF is not NACE -- no sector-to-NACE mapping is
          possible without significant assumptions.
        tests:
          - not_null
      - name: airpol
        description: >
          Air pollutant code. 'GHG' = total greenhouse gases in CO2-equivalent.
          env_air_gge reports only GHG-aggregate totals (unlike AEA, which also
          covers individual pollutants).
        tests:
          - not_null
      - name: unit
        description: >
          Unit of measurement. 'MIO_T' = million tonnes CO2-equivalent (= megatonnes),
          the same unit as CBS 85669NED's emissions_mt_co2eq column. No unit
          conversion is needed to compare NL national totals against CBS.
        tests:
          - not_null
      - name: year
        description: Reporting year, cast from the source TIME_PERIOD string.
        tests:
          - not_null
      - name: value_mio_t_co2eq
        description: >
          Emission value in million tonnes CO2-equivalent (= megatonnes). Nullable --
          some source cells carry no observation; NULL is left as NULL, never a
          placeholder zero.

  - name: stg_eua__auction_results
    description: >
      Typed 1:1 view of the pinned EEX EU ETS primary-market auction results
      (auction clearing price and outcome per auction event). A straight
      read/relabel of the pinned snapshot: no computation, no row filtering. Per
      CLAUDE.md invariant 5 this is context for a future site overlay only -- it
      must never be ref'd by a benchmark mart or the ESRS E1 export.
    columns:
      - name: auction_key
        description: Surrogate natural key (auction date serial | auction name).
        tests:
          - unique
          - not_null
      - name: auction_date
        description: Auction date, decoded from the Excel serial-date Time column.
        tests:
          - not_null
      - name: auction_name
        description: Auction platform / name (e.g. T3PA, PL, DE).
        tests:
          - not_null
      - name: auction_price_eur_per_tco2
        description: >
          Auction clearing price in EUR per tonne CO2. Nullable -- a cancelled or
          non-numeric auction row carries no price; NULL is left as NULL, never a
          placeholder zero.

  - name: stg_eea__ets
    description: >
      Typed 1:1 view of the EEA EU ETS aggregate (country x main activity x year
      x CITL category x size) -- Cairn's official benchmark denominator and
      cross-check. `value` is NULL where the source cell is a label, not a number.
    columns:
      - name: observation_key
        description: Surrogate natural key (country|activity|category|year|size).
        tests:
          - unique
          - not_null
      - name: year
        description: Reporting year.
        tests:
          - not_null

  - name: stg_emissieregistratie__crf_summary1
    description: >
      Typed view of the RIVM/UNFCCC CRF (Common Reporting Format) Summary1
      national GHG inventory snapshot, unpivoted from the source's
      one-column-per-gas layout into one row per IPCC source/sink category x
      gas x inventory year. NL only, 1990 to the latest submitted inventory
      year. A units sub-header row present in the raw sheet (see the
      ingestion pipeline's docstring) is dropped as structural noise, not a
      methodology filter.
    columns:
      - name: observation_key
        description: Surrogate natural key (ipcc_category|gas|year).
        tests:
          - unique
          - not_null
      - name: year
        description: Inventory year.
        tests:
          - not_null
      - name: ipcc_category
        description: >
          IPCC source/sink category, source code and label combined as one
          string (e.g. "1. Energy", "1.A. Fuel combustion") -- the sheet has
          no separate code column.
        tests:
          - not_null
      - name: gas
        description: >
          Gas/basket this row's value belongs to, derived from the source
          column it was unpivoted from.
        tests:
          - not_null
          - accepted_values:
              values:
                ["net_co2", "ch4", "n2o", "hfcs", "pfcs",
                 "unspecified_mix_hfc_pfc", "sf6", "nf3", "nox", "co",
                 "nmvoc", "sox", "total_ghg"]
      - name: unit
        description: >
          Unit of measurement. "kt" for single, well-defined substances
          (native mass); "kt_co2eq" for the F-gas baskets (hfcs, pfcs,
          unspecified_mix_hfc_pfc) and the total, which aggregate compounds
          with different GWPs and so carry no native-mass unit (see the CRF
          Summary1 footnotes referenced in the model file).
        tests:
          - not_null
          - accepted_values:
              values: ["kt", "kt_co2eq"]
      - name: value
        description: >
          Emission/removal value in the row's unit. Nullable -- the source
          also uses UNFCCC notation keys (e.g. "NE" = not estimated) in place
          of a number for some cells; those parse to NULL, never a
          placeholder zero.
