[project]
name = "cairn"
version = "0.1.0"
description = "Queryable benchmark layer on top of official EU/NL climate data (CBS, EEA, EU ETS)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dlt>=1.4",
    "dbt-core>=1.8",
    "dbt-duckdb>=1.8",
    "duckdb>=1.0",
    "pydantic>=2.7",
    "boto3>=1.34",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "ruff>=0.6",
    "sqlfluff>=3.0",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
